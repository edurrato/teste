let S=null, me={seat:-1}, sel=null, selCov=null, placing=false, aud=null;
const net={peer:null,conns:{},conn:null};

function newState(){const s={n:20,free:false,cover:[],chars:{},priv:{},pw:{},on:{},log:[],nid:1};
  s.pw[0]='mestre';for(let i=1;i<=SEATS;i++)s.pw[i]='jogador'+i;return s}
function mkChar(o){return Object.assign({id:'c'+(S.nid++),name:'?',secret:'',theme:'',kind:'hero',seat:0,x:0,y:0,mv:6,mvmax:6,avatar:'',
  vigor:10,vmax:10,pulso:3,pmax:3,arch:'',trilha:'',birth:'',ready:true},o)}
function ensureSeat(seat){ // cria herói + baralho privado da cadeira
  if(!S.chars['h'+seat])S.chars['h'+seat]=mkChar({id:'h'+seat,name:'Herói '+seat,seat,x:(seat-1)%S.n,y:S.n-1,ready:false});
  const P=S.priv[seat];if(!P||[...P.deck,...P.hand,...P.disc].some(x=>typeof x!=='number')){S.priv[seat]={deck:[],hand:[],disc:[]};rebuild(seat)}}
/* Baralho automático: 15 cartas da Trilha (+2 do Nascimento, remove 2 pelas cotas 7/5/3 do livro) */
function autoDeck(arch,tr,birth){const ix=CARDS.map((_,i)=>i),pool=ix.filter(i=>CARDS[i].a===arch&&CARDS[i].k===tr&&!CARDS[i].b);
  if(!pool.length)return[];const keep=birth?ix.filter(i=>CARDS[i].b===birth):[],want={comum:7,rara:5,epica:3};
  pool.forEach(i=>{const r=CARDS[i].r;if(keep.length<15&&keep.filter(j=>CARDS[j].r===r).length<want[r]+1)keep.push(i)});
  pool.forEach(i=>{if(keep.length<15&&!keep.includes(i))keep.push(i)});return keep.slice(0,15)}
function rebuild(seat){const c=S.chars['h'+seat],P=S.priv[seat];if(!c||!P)return;P.deck=shuffle(autoDeck(c.arch,c.trilha,c.birth));P.hand=[];P.disc=[]}

/* grid: movimento em 8 direções, custo 1 por célula (Chebyshev); coberturas e tokens bloqueiam */
function blocked(x,y,except){return S.cover.some(v=>x>=v.x&&x<v.x+v.w&&y>=v.y&&y<v.y+v.h)||Object.values(S.chars).some(o=>o.id!==except&&o.ready!==false&&o.x===x&&o.y===y)}
function reach(c,free){const lim=free?999:c.mv,d=new Map([[c.x+','+c.y,0]]),q=[[c.x,c.y]];
  while(q.length){const[x,y]=q.shift(),k=d.get(x+','+y);if(k>=lim)continue;
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy,key=nx+','+ny;
      if(nx<0||ny<0||nx>=S.n||ny>=S.n||d.has(key)||blocked(nx,ny,c.id))continue;d.set(key,k+1);q.push([nx,ny])}}
  d.delete(c.x+','+c.y);return d}

function apply(seat,a){ // seat 0 = Mestre. Todas as mutações passam por aqui (validação central).
  const M=seat===0,c=S.chars[a.id],own=c&&(M||c.seat===seat),tgt=M?(a.seat||0):seat,P=S.priv[tgt];
  switch(a.t){
    case 'move':{if(!own)return;const cost=reach(c,M&&S.free).get(a.x+','+a.y);if(cost===undefined)return;c.x=a.x;c.y=a.y;if(!(M&&S.free))c.mv-=cost;break}
    case 'patch':{if(!own)return;const ok=['name','secret','theme','avatar','vigor','vmax','pulso','pmax','arch','trilha','birth'];if(M)ok.push('mv','mvmax','kind');
      for(const k of ok)if(k in a.p){if(!M&&['arch','trilha','birth'].includes(k))continue;let v=a.p[k];if(k==='avatar'&&String(v).length>90000)continue;if(typeof c[k]==='number')v=Math.max(0,Math.floor(+v)||0);c[k]=v}if(M&&c.seat&&('arch' in a.p||'trilha' in a.p||'birth' in a.p))rebuild(c.seat);break}
    case 'create':{const hc=S.chars['h'+seat],q=a.p||{};if(M||!hc||hc.ready!==false)return;
      const Ar=ARCH[q.arch];if(!Ar||!Ar.tr[q.trilha]||!BIRTHS.some(b=>b.name===q.birth))return;
      const pool=poolIds(q.arch,q.trilha,q.birth),dk=[...new Set(q.deck||[])].filter(i=>pool.includes(i));if(dk.length!==15)return;
      Object.assign(hc,{name:String(q.name||'').slice(0,40)||hc.name,secret:String(q.secret||'').slice(0,60),theme:String(q.theme||'').slice(0,300),arch:q.arch,trilha:q.trilha,birth:q.birth,vmax:Ar.v,vigor:Ar.v,pmax:Ar.p,pulso:Ar.p,ready:true});
      if(q.avatar&&String(q.avatar).length<90000)hc.avatar=q.avatar;
      let x=0;while(x<S.n&&blocked(x,S.n-1,hc.id))x++;hc.x=Math.min(x,S.n-1);hc.y=S.n-1;
      S.priv[seat]={deck:shuffle(dk),hand:[],disc:[]};S.log.push(hc.name+' entrou na mesa!');S.log=S.log.slice(-15);break}
    case 'draw':{if(!P)return;while(P.hand.length<3){if(!P.deck.length){if(!P.disc.length)break;P.deck=shuffle(P.disc);P.disc=[]}P.hand.push(P.deck.pop())}break}
    case 'discard':{if(!P||!(a.i in P.hand))return;P.disc.push(P.hand.splice(a.i,1)[0]);break}
    case 'play':{const hc=S.chars['h'+tgt];if(!P||!hc||!(a.i in P.hand))return;const cd=CARDS[P.hand[a.i]];if(hc.pulso<cd.c)return;
      hc.pulso-=cd.c;P.disc.push(P.hand.splice(a.i,1)[0]);S.log.push(hc.name+' jogou '+SG[cd.s]+' '+cd.n+' (Pulso −'+cd.c+')');S.log=S.log.slice(-15);break}
    case 'reshuffle':{if(!P)return;P.deck=shuffle([...P.deck,...P.disc,...P.hand]);P.disc=[];P.hand=[];break}
    /* ---- apenas Mestre ---- */
    case 'addchar':{if(!M)return;const k=a.kind,n=Object.values(S.chars).filter(o=>o.kind===k).length+1;const ch=mkChar({kind:k,name:KIND[k].n+' '+n,x:Math.floor(S.n/2),y:1});S.chars[ch.id]=ch;break}
    case 'delchar':{if(!M||!c||c.seat)return;delete S.chars[a.id];break}
    case 'newturn':{if(!M)return;Object.values(S.chars).forEach(o=>o.mv=o.mvmax);break}
    case 'free':{if(!M)return;S.free=!!a.v;break}
    case 'size':{if(!M)return;S.n=Math.min(40,Math.max(8,Math.floor(+a.n)||20));break}
    case 'pw':{if(!M)return;S.pw[a.seat]=String(a.v).slice(0,40);break}
    case 'cvadd':{if(!M)return;S.cover.push({id:'v'+(S.nid++),x:a.x,y:a.y,w:2,h:2,label:''});break}
    case 'cvset':{if(!M)return;const v=S.cover.find(o=>o.id===a.id);if(!v)return;
      for(const k of['x','y','w','h'])if(k in a.p)v[k]=Math.max(k[0]==='w'||k[0]==='h'?1:0,Math.min(S.n-(k==='w'||k==='h'?0:1),Math.floor(+a.p[k])||0));
      if('label' in a.p)v.label=String(a.p.label).slice(0,20);break}
    case 'cvdel':{if(!M)return;S.cover=S.cover.filter(o=>o.id!==a.id);break}
  }
}
function act(a){ if(me.seat===0){apply(0,a);push()} else if(net.conn&&net.conn.open)net.conn.send({t:'act',a}) }

/* =====================================================================
   MÓDULO 2 — REDE P2P (PeerJS). Mestre = host; jogadores conectam nele.
   Privacidade: o Mestre envia a cada jogador apenas o baralho/mão/descarte DELE.
   ===================================================================== */
function view(seat){const v=JSON.parse(JSON.stringify(S));delete v.pw;
  if(seat){Object.values(v.chars).forEach(c=>{if(c.seat!==seat)c.secret=''});const p=v.priv[seat];v.priv={};if(p)v.priv[seat]=p}return v}
function push(){
  if(me.seat===0){try{localStorage.setItem('alv-state',JSON.stringify(S))}catch(e){}
    Object.values(net.conns).forEach(c=>c.open&&c.send({t:'state',s:view(c.seat)}))}
  render()}
function hostOnData(conn,d){
  if(d.t==='login'){
    const seat=+d.seat;
    if(!(seat>=1&&seat<=SEATS)||!pwOk(S.pw[seat],d.pw))return conn.send({t:'err',m:'Senha incorreta.'});
    if(net.conns[seat]&&net.conns[seat].open&&net.conns[seat]!==conn)return conn.send({t:'err',m:'Cadeira já ocupada.'});
    conn.seat=seat;net.conns[seat]=conn;S.on[seat]=true;ensureSeat(seat);push();
  }else if(d.t==='act'&&conn.seat){apply(conn.seat,d.a);push()}
}
function startHost(code){
  net.peer=new Peer('alvorecer-rpg-'+code.toLowerCase());
  net.peer.on('open',()=>{showApp();$('#pNet').textContent='Mesa "'+code+'" aberta'});
  net.peer.on('error',e=>loginErr(e.type==='unavailable-id'?'Esse código já está em uso (feche outra aba do Mestre ou troque o código).':'Erro de rede: '+e.type));
  net.peer.on('connection',conn=>{
    if(Object.values(net.conns).filter(c=>c.open).length>=SEATS&&!conn.seat){conn.on('open',()=>{conn.send({t:'err',m:'Mesa cheia.'});conn.close()});return}
    conn.on('data',d=>hostOnData(conn,d));
    conn.on('close',()=>{if(conn.seat&&net.conns[conn.seat]===conn){delete net.conns[conn.seat];delete S.on[conn.seat];push()}});
  });
}
function startClient(code,seat,pw){
  net.peer=new Peer();
  net.peer.on('error',e=>loginErr(e.type==='peer-unavailable'?'Mesa não encontrada. O Mestre já entrou?':'Erro de rede: '+e.type));
  net.peer.on('open',()=>{const c=net.conn=net.peer.connect('alvorecer-rpg-'+code.toLowerCase(),{reliable:true});
    c.on('open',()=>c.send({t:'login',seat,pw}));
    c.on('data',d=>{if(d.t==='err')loginErr(d.m);else if(d.t==='state'){S=d.s;if($('#app').hidden){showApp();$('#pNet').textContent='Conectado à mesa "'+code+'"'}render()}});
    c.on('close',()=>{$('#pNet').textContent='⚠ Desconectado';$('#hint').textContent='Conexão perdida. Saia e entre novamente.'})});
}

$('#lseat').innerHTML='<option value="0">Mestre</option>'+Array.from({length:SEATS},(_,i)=>`<option value="${i+1}">Jogador ${i+1}</option>`).join('');
function loginErr(m){SFX.err();clearTimeout(net.to);$('#err').style.color='';$('#err').textContent=m;if(net.peer&&!S)try{net.peer.destroy()}catch(e){}; if(S&&me.seat>0){$('#app').hidden=true;$('#menu').hidden=false;S=null}}
function showApp(){clearTimeout(net.to);$('#err').textContent='';$('#menu').hidden=true;stopMenu();$('#app').hidden=false;$('#pRole').textContent=me.seat?'Jogador '+me.seat:'Mestre';render()}

const canCtl=c=>c&&(me.seat===0||c.seat===me.seat);
function renderBoard(){
  const b=$('#board'),n=S.n,u=100/n;b.style.setProperty('--n',n);
  const pos=(x,y)=>`left:${x*u}%;top:${y*u}%`;let h='';
  S.cover.forEach(v=>h+=`<div class="cov${v.id===selCov?' on':''}" data-cv="${v.id}" style="${pos(v.x,v.y)};width:${v.w*u}%;height:${v.h*u}%">${esc(v.label)}</div>`);
  const c=S.chars[sel];
  if(c&&canCtl(c))reach(c,me.seat===0&&S.free).forEach((_,k)=>{const[x,y]=k.split(',');h+=`<div class="cell hl" data-x="${x}" data-y="${y}" style="${pos(x,y)}"></div>`});
  Object.values(S.chars).forEach(o=>{if(o.ready===false)return;const col=o.kind==='hero'&&o.trilha?thc(o):KIND[o.kind].c;
    h+=`<div class="cell tok${o.id===sel?' sel':''}" data-id="${o.id}" style="${pos(o.x,o.y)}" title="${esc(o.name)}"><div style="--c:${col};${o.avatar?`background-image:url(${o.avatar})`:''}">${o.avatar?'':esc(o.name.slice(0,2).toUpperCase())}</div><span class="nm">${esc(o.name)}</span></div>`});
  b.innerHTML=h;
  $('#hint').textContent=placing?'Clique numa célula para posicionar a cobertura.':c?(canCtl(c)?`${c.name}: movimento restante ${me.seat===0&&S.free?'livre':c.mv} · clique numa célula azul para mover, ou no token para desmarcar.`:''):'Clique no seu token para ver o alcance de movimento.'}
$('#board').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*S.n),y=Math.floor((e.clientY-r.top)/r.height*S.n);
  if(x<0||y<0||x>=S.n||y>=S.n)return;
  if(placing){placing=false;act({t:'cvadd',x:Math.min(x,S.n-2),y:Math.min(y,S.n-2)});selCov=S.cover[S.cover.length-1].id;sel=null;tab='cena';renderAll();return}
  const tok=Object.values(S.chars).find(o=>o.ready!==false&&o.x===x&&o.y===y);
  if(tok){ if(canCtl(tok)){sel=sel===tok.id?null:tok.id;selCov=null} renderAll();return}
  if(sel&&e.target.classList.contains('hl')){act({t:'move',id:sel,x,y});SFX.move();return}
  if(me.seat===0){const v=S.cover.find(o=>x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h);
    if(v){selCov=v.id;sel=null}else if(selCov){act({t:'cvset',id:selCov,p:{x,y}});return}
    renderAll()}
});

function loadAvatar(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const z=128,cv=document.createElement('canvas');cv.width=cv.height=z;const g=cv.getContext('2d');g.fillStyle='#222';g.fillRect(0,0,z,z);
  const s=Math.min(im.width,im.height);g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,z,z);cb(cv.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)}
function stopTheme(){if(aud){aud.pause();aud=null}$('#yt').innerHTML=''}
function playTheme(t){stopTheme();t=(t||'').trim();const y=t.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
  if(y)$('#yt').innerHTML=`<iframe width="100%" height="70" src="https://www.youtube.com/embed/${y[1]}?autoplay=1" allow="autoplay;encrypted-media" style="border:0"></iframe>`;
  else if(/^https?:\/\//.test(t)){aud=new Audio(t);aud.loop=true;aud.play().catch(()=>{$('#hint').textContent='Não foi possível tocar esse link (use mp3/ogg direto ou YouTube).'})}}
function pb(label,v,m,cls){return `<div class="stat"><b>${label} ${v}/${m}</b><div class="bar ${cls}" style="flex:1"><i style="width:${m?Math.min(100,v/m*100):0}%"></i></div></div>`}

  <div class="row"><div class="avprev f0" style="${c.avatar?`background-image:url(${c.avatar})`:''}"></div>
    <div><label style="margin-top:0">Avatar (PNG/JPG)</label><input type="file" id="av" accept="image/png,image/jpeg" ${d}></div></div>
  <label>Nome do Herói</label><input data-f="name" value="${esc(c.name)}" ${d}>
  ${c.kind==='hero'?`<label>Identidade Secreta</label><input data-f="secret" value="${esc(c.secret)}" ${d} placeholder="${can?'':'(oculta)'}">`:''}
  <label>Música Tema (link mp3/ogg ou YouTube; ou texto)</label>

  <select data-f="trilha" ${M?d:'disabled'}><option value="">—</option>${(A?Object.keys(A.tr):[]).map(t=>`<option ${t===c.trilha?'selected':''}>${t}</option>`).join('')}</select></div>
  ${c.kind==='hero'?`<label>Nascimento</label><select data-f="birth" ${M?d:'disabled'}><option value="">—</option>${BIRTHS.map(b=>`<option ${b.name===c.birth?'selected':''}>${b.name}</option>`).join('')}</select>${(BIRTHS.find(b=>b.name===c.birth)||{}).pt?`<div class="mut" style="margin-top:4px"><b>${esc(BIRTHS.find(b=>b.name===c.birth).pn)}:</b> ${esc(BIRTHS.find(b=>b.name===c.birth).pt)}</div>`:''}`:''}
  <label>Vigor / Pulso</label>${pb('Vigor',c.vigor,c.vmax,'')}

  <label>Tipo</label><select data-f="kind">${Object.keys(KIND).map(k=>`<option value="${k}" ${k===c.kind?'selected':''}>${KIND[k].n}</option>`).join('')}</select>`:`<div class="mut" style="margin-top:8px">Movimento: ${c.mv}/${c.mvmax}</div>`}`;
  el.dataset.cid=c.id;
}
$('#sheet').addEventListener('change',e=>{const id=$('#sheet').dataset.cid,t=e.target;
  if(t.id==='av'&&t.files[0])return loadAvatar(t.files[0],u=>act({t:'patch',id,p:{avatar:u}}));
  const f=t.dataset.f;if(!f)return;let p={[f]:t.value};
  if(f==='arch'){const A=ARCH[t.value];p=A?{arch:t.value,trilha:'',vmax:A.v,vigor:A.v,pmax:A.p,pulso:A.p}:{arch:'',trilha:''}}
  act({t:'patch',id,p});
  if(f==='theme'||f==='name')setTimeout(renderAll,0)});
$('#sheet').addEventListener('click',e=>{const id=$('#sheet').dataset.cid,c=S.chars[id],t=e.target;

   na fase 2 substitua por cartas do sistema em ensureSeat() e adicione regras em apply().

let cseat=1;
function cardHTML(id,i,ch){const c=CARDS[id];return `<div class="gc ${c.r}"><div class="gh"><span class="cost">${c.c}</span><b>${esc(c.n)}</b><span class="sg s-${c.s}">${SG[c.s]}</span></div><div class="gt">${esc(c.t)}</div>
  <div class="gf"><span class="mut">${RAR[c.r]}${c.x?' · Reação':''}${c.o?' · Sobrecarga':''}</span><span><button class="sm pri" data-sfx="card" data-play="${i}" ${ch&&ch.pulso>=c.c?'':'disabled'}>Jogar</button> <button class="sm" data-i="${i}">Descartar</button></span></div></div>`}

  const log=`<h3 style="margin-top:12px">Jogadas recentes</h3><div class="mut">${S.log.slice().reverse().map(esc).join('<br>')||'—'}</div>`;
  if(!P){el.innerHTML=`<h3>Cartas</h3>${sel_}<div class="mut">${M?'Essa cadeira ainda não entrou.':'Sem baralho.'}</div>${log}`;return}

  ${tot?'':'<div class="mut" style="margin:8px 0">Escolha Arquétipo, Trilha e Nascimento na ficha: o baralho é montado automaticamente (15 cartas).</div>'}
  <div style="margin:8px 0">${P.hand.map((x,i)=>cardHTML(x,i,ch)).join('')||(tot?'<span class="mut">Mão vazia</span>':'')}</div>
  <div class="row"><button data-c="draw" data-sfx="card" class="pri" ${tot?'':'disabled'}>Comprar até 3</button><button data-c="reshuffle" ${tot?'':'disabled'}>Reembaralhar tudo</button></div>

$('#cards').addEventListener('change',e=>{if(e.target.id==='cs'){cseat=+e.target.value;renderCards()}});
$('#cards').addEventListener('click',e=>{const seat=me.seat===0?cseat:me.seat,t=e.target.closest('[data-i],[data-c],[data-play]');if(!t)return;

  <input data-cv="label" value="${esc(v.label)}" placeholder="Rótulo" style="margin-top:6px"><div class="mut">Clique numa célula livre para mover a cobertura selecionada.</div>`:'<div class="mut" style="margin-top:6px">Clique numa cobertura para editar largura × altura.</div>'}`;

  <h3 style="margin-top:14px">Senhas das cadeiras</h3><div class="list">${Array.from({length:SEATS+1},(_,i)=>`<div><span class="dot ${i===0||S.on[i]?'on':''}"></span><span>${i?'Jogador '+i:'Mestre'}${i&&S.chars['h'+i]&&S.chars['h'+i].ready===false?' <small class="mut">criando</small>':''}</span><input data-pw="${i}" value="${esc(S.pw[i])}" style="width:130px"></div>`).join('')}</div>`;
  el.innerHTML=h}
$('#master').addEventListener('click',e=>{const t=e.target,d=t.dataset;

/* =====================================================================

   ===================================================================== */
let tab='ficha';
const TABS_P=[['ficha','🧑','Ficha'],['cartas','🃏','Cartas']],TABS_M=[['ficha','🧑','Ficha'],['cartas','🃏','Cartas'],['npc','👥','Personagens'],['cena','🧱','Cenário'],['mesa','⚙','Mesa']];
function renderTabs(){const T=me.seat===0?TABS_M:TABS_P;if(!T.some(x=>x[0]===tab))tab='ficha';
  $('#tabs').innerHTML=T.map(t=>`<button class="${t[0]===tab?'on':''}" data-tab="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
  $('#sheet').hidden=tab!=='ficha';$('#cards').hidden=tab!=='cartas';$('#master').hidden=!['npc','cena','mesa'].includes(tab)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;renderAll()}});
function renderTools(){const mb='<button class="mutebtn" data-t="mute"></button>';
  $('#tools').innerHTML=me.seat===0?`<button class="pri" data-t="turn">⏭ Novo turno</button><button data-t="cover">🧱 Cobertura</button><button data-t="add-capanga">+ Capanga</button><button data-t="add-vilao">+ Vilão</button><button data-t="free" class="${S.free?'on':''}">🕊 Livre</button>${mb}`
  :`<button data-t="mine" class="${sel==='h'+me.seat?'on':''}">🎯 Meu token</button><button data-t="draw" data-sfx="card">🃏 Comprar até 3</button>${mb}`;syncMute()}
$('#tools').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(!t)return;const k=t.dataset.t;
  if(k==='mine'){const c=S.chars['h'+me.seat];if(c&&c.ready!==false){sel=sel===c.id?null:c.id;renderAll()}}
  else if(k==='draw')act({t:'draw',seat:me.seat});else if(k==='mute')toggleMute();else if(k==='turn')act({t:'newturn'});
  else if(k==='cover'){placing=true;renderBoard()}else if(k==='free')act({t:'free',v:!S.free});else if(k.startsWith('add-'))act({t:'addchar',kind:k.slice(4)})});
function theme(){const mine=S.chars['h'+me.seat],c=S.chars[sel]||mine;
  $('#app').style.setProperty('--th',thc(me.seat?mine:S.chars[sel]));$('#sheet').style.setProperty('--th',thc(c));$('#cards').style.setProperty('--th',thc(S.chars['h'+(me.seat||cseat)]))}

/* =====================================================================
   MÓDULO 9 — CRIAÇÃO DO HERÓI (jogador): identidade, arquétipo, trilha, nascimento e baralho por raridade
   ===================================================================== */
let W=null;
function renderWiz(){const w=$('#wiz'),h=S&&me.seat>0&&S.chars['h'+me.seat],need=h&&h.ready===false;
  if(!need){if(!w.hidden)w.hidden=true;W=null;return}
  if(!w.hidden)return;w.hidden=false;W={name:'',secret:'',theme:'',avatar:'',arch:'',tr:'',birth:'',pick:new Set()};
  w.innerHTML=`<div class="wbox" id="wbox"><h1 style="color:var(--th)">Criação do Herói</h1><div class="mut">Preencha a identidade, escolha Arquétipo, Trilha e Nascimento e monte seu baralho de 15 cartas.</div>
  <h2>1 · Identidade</h2>
  <div class="row"><div class="avprev f0" id="wav"></div><div><label style="margin-top:0">Avatar (PNG/JPG)</label><input type="file" id="wfile" accept="image/png,image/jpeg"></div></div>
  <label>Nome do Herói</label><input data-w="name" maxlength="40"><label>Identidade Secreta</label><input data-w="secret" maxlength="60">
  <label>Música Tema (link mp3/ogg ou YouTube; ou texto)</label><div class="row"><input data-w="theme"><button class="f0" data-wp="1">▶</button><button class="f0" data-wp="0">■</button></div>
  <h2>2 · Arquétipo</h2><div class="opts" id="wA"></div><h2>3 · Trilha</h2><div class="opts" id="wT"></div><h2>4 · Nascimento</h2><div class="opts" id="wB"></div>
  <h2>5 · Seu baralho</h2><div class="mut" id="wDn"></div><div id="wD"></div></div><div class="wbar"><span class="badge" id="wCnt"></span><button class="pri" id="wgo">✔ Confirmar herói e entrar no mapa</button></div>`;
  wizDraw()}
function repick(){W.pick=new Set(W.tr&&W.birth?autoDeck(W.arch,W.tr,W.birth):poolIds(W.arch,W.tr,W.birth))}
function wizDraw(){const th=TC[W.tr]||'#f08a3c',A=ARCH[W.arch];$('#wbox').style.setProperty('--th',th);
  $('#wA').innerHTML=Object.entries(ARCH).map(([n,a])=>`<div class="opt${W.arch===n?' on':''}" data-wa="${n}" title="${esc(a.ch)}"><b>${n}</b><small>${DESC[n]}</small><small>Vigor ${a.v} · Pulso ${a.p} · Iniciativa ${a.i}º</small></div>`).join('');
  $('#wT').innerHTML=A?Object.entries(A.tr).map(([n,t])=>`<div class="opt${W.tr===n?' on':''}" data-wt="${n}" style="--oc:${TC[n]}"><b style="color:${TC[n]}">${n}</b><small>${esc(t)}</small></div>`).join(''):'<div class="mut">Escolha um arquétipo.</div>';
  $('#wB').innerHTML=BIRTHS.map(b=>`<div class="opt${W.birth===b.name?' on':''}" data-wb="${esc(b.name)}"><b>${b.name}</b><small><u>${esc(b.pn)}</u>: ${esc(short(b.pt,130))}</small></div>`).join('');
  const pool=poolIds(W.arch,W.tr,W.birth),full=W.tr&&W.birth;
  $('#wDn').textContent=full?'Trilha (15) + Nascimento (2) = 17 cartas: toque nas cartas para remover 2 e ficar com 15, ou use a sugestão.':'Escolha Trilha e Nascimento para montar o baralho. Abaixo, as cartas disponíveis até agora.';
  $('#wD').innerHTML=(full?'<button data-wauto="1" style="margin:6px 0">✨ Sugerir 15 cartas</button>':'')+['comum','rara','epica'].map(r=>{const L=pool.filter(i=>CARDS[i].r===r);
    return L.length?`<h3 style="margin-top:12px">${RAR[r]}s (${L.filter(i=>W.pick.has(i)).length}/${L.length})</h3>`+L.map(i=>{const c=CARDS[i];return `<div class="chk${W.pick.has(i)?' on':''}" data-wc="${i}"><span class="cost" style="background:#fff;color:#111">${c.c}</span><b>${esc(c.n)}</b><span class="sg s-${c.s}" style="font-size:18px;background:#f3efe8;border-radius:4px;padding:0 4px">${SG[c.s]}</span>${c.b?'<span class="badge">★ '+esc(c.b)+'</span>':''}<small>${esc(c.t)}</small></div>`}).join(''):''}).join('')||'<div class="mut">—</div>';
  wizBar()}
function wizBar(){const ok=W.name.trim()&&W.arch&&W.tr&&W.birth&&W.pick.size===15;$('#wCnt').textContent=W.pick.size+'/15 cartas';$('#wgo').disabled=!ok}
$('#wiz').addEventListener('input',e=>{const k=e.target.dataset.w;if(k&&W){W[k]=e.target.value;wizBar()}});
$('#wiz').addEventListener('change',e=>{if(e.target.id==='wfile'&&e.target.files[0])loadAvatar(e.target.files[0],u=>{W.avatar=u;$('#wav').style.backgroundImage='url('+u+')'})});
$('#wiz').addEventListener('click',e=>{const t=e.target.closest('[data-wa],[data-wt],[data-wb],[data-wc],[data-wauto],[data-wp],#wgo');if(!t||!W)return;const d=t.dataset;
  if(d.wa){if(W.arch!==d.wa){W.arch=d.wa;W.tr='';repick()}}
  else if(d.wt){W.tr=d.wt;repick()}else if(d.wb){W.birth=d.wb;repick()}else if(d.wauto)repick()
  else if(d.wp!==undefined){d.wp==='1'?playTheme(W.theme):stopTheme();return}
  else if(d.wc!==undefined){const i=+d.wc;if(!(W.tr&&W.birth))return;if(W.pick.has(i))W.pick.delete(i);else if(W.pick.size<15)W.pick.add(i);else{SFX.err();return}}
  else if(t.id==='wgo'){if(t.disabled)return;stopTheme();act({t:'create',p:{name:W.name.trim(),secret:W.secret,theme:W.theme,avatar:W.avatar,arch:W.arch,trilha:W.tr,birth:W.birth,deck:[...W.pick]}});return}
  wizDraw()});

function renderAll(){renderTabs();renderTools();theme();renderBoard();renderSheet();renderCards();renderMaster();renderWiz()}
function render(){if(!S)return;if(sel&&!S.chars[sel])sel=null;renderAll()}
</script>
</body>
</html>
