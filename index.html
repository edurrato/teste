<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alvorecer RPG — Mesa Virtual</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#12121a;--pn:#1b1b27;--pn2:#242436;--ink:#ece8df;--mut:#9b97ab;--ln:#33344a;--dawn:#f08a3c;--blue:#3b82f6;--good:#4cc38a;--bad:#ef6a5a;
--hero:#5aa0f0;--capanga:#8d8d9c;--vilao:#ef5a7c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,'Segoe UI',sans-serif}
h1,h2,h3{margin:0;font-family:'Arial Narrow',Oswald,sans-serif;text-transform:uppercase;letter-spacing:.06em}
h3{font-size:15px;color:var(--dawn);margin-bottom:8px}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--pn2);border:1px solid var(--ln);border-radius:4px;padding:6px 8px;min-width:0;width:100%}
button{background:var(--pn2);border:1px solid var(--ln);border-radius:4px;padding:6px 11px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--dawn)} button:disabled{opacity:.4}
.pri{background:var(--dawn);color:#1a1006;border-color:var(--dawn);font-weight:700}
.bad{color:var(--bad);border-color:var(--bad)} .sm{padding:2px 8px}
.mut{color:var(--mut);font-size:13px} .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap} .row>*{flex:1} .row>button,.row>.f0{flex:0 0 auto}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
#menu{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:#000}#menu[hidden],#wiz[hidden]{display:none}
.bg{position:absolute;inset:0;background:center/cover;opacity:0;transition:opacity 1.8s}.bg.on{opacity:1;animation:kb 14s linear forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
.shade{position:absolute;inset:0;background:linear-gradient(#0008,#000a)}
#mute{position:absolute;top:12px;right:12px;z-index:3;font-size:18px}
#login{max-width:380px;width:92%;margin:0;padding:20px;position:relative;z-index:2;background:rgba(18,18,28,.8);backdrop-filter:blur(6px)}
#login h1{font-size:30px;color:var(--dawn);margin-bottom:4px}
#err{color:var(--bad);min-height:20px;margin-top:8px}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
header h2{color:var(--dawn);font-size:20px}
.pill{border:1px solid var(--ln);border-radius:99px;padding:2px 10px;font-size:12.5px;background:var(--pn);color:var(--mut)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;padding:12px;max-width:1500px;margin:0 auto;align-items:start}
@media(max-width:980px){main{grid-template-columns:minmax(0,1fr)}}
/* GRID: proporção quadrada 1:1, células = 100%/n (quadradas por construção) */
.boardwrap{max-width:min(100%,82vh);margin:0 auto}
.board{position:relative;width:100%;aspect-ratio:1/1;background-color:#171724;border:2px solid #5a5c7c;touch-action:manipulation;user-select:none;overflow:hidden;
background-image:linear-gradient(#2c2d42 1px,transparent 1px),linear-gradient(90deg,#2c2d42 1px,transparent 1px);
background-size:calc(100%/var(--n)) calc(100%/var(--n))}
.cell{position:absolute;width:calc(100%/var(--n));height:calc(100%/var(--n));aspect-ratio:1/1}
.hl{background:rgba(59,130,246,.45);outline:1px solid #60a5fa;outline-offset:-1px;cursor:pointer;z-index:2}
.cov{background:repeating-linear-gradient(45deg,#4a4256,#4a4256 6px,#3a3446 6px,#3a3446 12px);border:2px solid #8a8170;z-index:1;font-size:11px;color:#ddd;display:grid;place-items:center;overflow:hidden}
.cov.on{border-color:var(--dawn)}
.tok{z-index:4;padding:8%;cursor:pointer}
.tok>div{width:100%;height:100%;border-radius:50%;border:3px solid var(--c);background:var(--c) center/cover;display:grid;place-items:center;font-weight:700;color:#fff;font-size:clamp(9px,1.6vw,16px);box-shadow:0 2px 6px #000a}
.tok.sel>div{box-shadow:0 0 0 3px var(--blue),0 0 14px var(--blue)}
.tok .nm{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:9px;line-height:1;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none;white-space:nowrap;overflow:hidden}
.bar{height:8px;background:var(--pn2);border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--bad)}.bar.p i{background:var(--blue)}
.stat{display:flex;gap:6px;align-items:center}.stat b{min-width:70px;font-size:13px}
.hand{display:flex;gap:8px;flex-wrap:wrap}.pc{width:54px;height:78px;border-radius:6px;background:#f3efe8;color:#111;display:grid;place-items:center;font-size:20px;font-weight:700;border:2px solid #fff;cursor:pointer}.pc.r{color:#c0392b}
.avprev{width:64px;height:64px;border-radius:50%;background:var(--pn2) center/cover;border:2px solid var(--ln);flex:0 0 64px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut)}.dot.on{background:var(--good)}
.list>div{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--ln)}.list>div>span{flex:1}
.gc{border:3px solid var(--th);border-radius:8px;background:#f3efe8;color:#1b1a22;padding:8px;margin-bottom:8px}
.gc.rara{outline:1px solid var(--th);outline-offset:2px}.gc.epica{box-shadow:0 0 12px var(--th);outline:1px solid var(--th);outline-offset:2px}
.gh{display:flex;gap:6px;align-items:center}.gh b{flex:1;font-size:14px}
.cost{background:#1b1a22;color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:700;flex:0 0 24px}
.sg{font-size:20px}.s-ouros,.s-copas{color:#c0392b}.s-espadas,.s-paus{color:#111}
.gt{font-size:13px;margin:6px 0}.gf{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}.gf .mut{color:#6b6678}
#app{--th:#f08a3c}header{border-bottom:2px solid var(--th)}.board{border-color:var(--th)}
#sheet,#cards{border:2px solid var(--th)}#sheet h3,#cards h3{color:var(--th)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tools button{padding:8px 12px}.tools button.on,.tabs button.on{border-color:var(--th);color:var(--th);background:#2c2c44}
.tabs{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto}.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;padding:6px 8px;white-space:nowrap}.tabs button span{font-size:18px}
#wiz{position:fixed;inset:0;background:rgba(8,8,14,.96);z-index:30;overflow:auto}
.wbox{max-width:780px;margin:0 auto;padding:16px 14px 100px;--th:#f08a3c}.wbox h2{color:var(--th);font-size:22px;margin:18px 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.opt,.chk{border:2px solid var(--ln);border-radius:8px;padding:8px;background:var(--pn);cursor:pointer;font-size:13px}.opt b{display:block;font-size:15px}.opt small,.chk small{display:block;color:var(--mut);margin-top:3px}
.opt.on{border-color:var(--oc,var(--th));box-shadow:0 0 10px var(--oc,var(--th));background:var(--pn2)}
.chk{display:flex;gap:6px;flex-wrap:wrap;align-items:center;opacity:.45;margin-bottom:6px}.chk.on{opacity:1;border-color:var(--th)}.chk b{flex:1}.chk small{flex:1 0 100%}
.wbar{position:fixed;left:0;right:0;bottom:0;background:#0c0c14;border-top:2px solid var(--th);padding:10px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:31}
.badge{border:1px solid var(--ln);border-radius:99px;padding:2px 10px;font-size:13px}
.gc button:not(.pri){background:#2b2a38;color:#f3efe8;border-color:#2b2a38}.pill{white-space:nowrap}.pill:empty{display:none}
#wbox h3{color:var(--th)}
</style>
</head>
<body>

<!-- ============ LOGIN: cadeiras e senhas ============ -->
<div id="menu"><div class="bg" id="bgA"></div><div class="bg" id="bgB"></div><div class="shade"></div><button id="mute" class="mutebtn sm" data-sfx="click"></button>
<div id="login" class="card">
  <h1>Alvorecer RPG</h1><div class="mut">Mesa Virtual Tática · Fase 1</div>
  <label>Código da mesa (o Mestre cria; jogadores usam o mesmo)</label>
  <input id="lcode" value="mesa1" maxlength="24">
  <label>Cadeira</label>
  <select id="lseat"></select>
  <label>Senha</label>
  <input id="lpw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div style="margin-top:12px"><button class="pri" id="lgo" style="width:100%">Entrar</button></div>
  <div id="err"></div>
  <p class="mut">Senhas padrão: Mestre = <b>mestre</b>; Jogador N = <b>jogadorN</b>. O Mestre as altera dentro da mesa. O Mestre deve entrar primeiro (ele hospeda a mesa).</p>
</div>
</div>
<div id="wiz" hidden></div>
<!-- ============ APP ============ -->
<div id="app" hidden>
  <header>
    <h2>Alvorecer · Mesa</h2>
    <div class="row f0"><span class="pill" id="pRole"></span><span class="pill" id="pNet"></span><button class="sm" id="out">Sair</button></div>
  </header>
  <div id="yt"></div>
  <main>
    <section>
      <div class="tools" id="tools"></div>
      <div class="boardwrap"><div class="board" id="board"></div></div>
      <div class="mut" id="hint" style="text-align:center;margin-top:6px"></div>
    </section>
    <aside>
      <div class="tabs" id="tabs"></div>
      <div class="card" id="sheet"></div>
      <div class="card" id="cards"></div>
      <div class="card" id="master"></div>
    </aside>
  </main>
</div>

<script>
/* =====================================================================
   MÓDULO 0 — DADOS DO SISTEMA (extraídos do Alvorecer_Mesa_Virtual)
   ===================================================================== */
const ARCH={"O Armado":{"v":14,"p":4,"i":5,"ch":"","tr":{"O Portador":"Artefato de Assinatura: defina o artefato e um Tipo de Dano fixo (Flamejante, Congelante, Elétrico, Venenoso, Solar, Sombrio ou Cinético). Todas as cartas de ataque da trilha usam esse tipo.","O Blindado":"Módulos & Bênçãos de Couraça: escolha 2 (Servomotores: +2 Cinético fixo e empurra 1 zona; Camada Isolante: RD 1 contra Flamejante/Elétrico; Propulsores: Voo; Selo de Sustento: imune a gases, vácuo, afogamento)."}},"O Vigilante":{"v":12,"p":3,"i":3,"ch":"Interrogatório Urbano: em Em Missão é o único que NÃO descarta cartas antes de um combate.","tr":{"O Punitivo":"Fúria Vingativa: Vigor perdido antes do seu turno vira +1 de dano fixo por ponto no primeiro ataque bem-sucedido.","O Pugilista":"Maestria de Estilos: 3 estilos (Demolidor, Serpente, Quebrador); monte o deck livremente entre eles."}},"O Arcano":{"v":9,"p":5,"i":4,"ch":"Percepção Etérea: em Em Missão, descarte 1 carta ♥ ou ♦ para detectar anomalias e ilusões.","tr":{"O Conjurador":"Feitiçaria de Gatilho: pague 1 Pulso e descarte uma carta da mão para lançar um Projétil Arcano de 1 de dano; o naipe define o tipo/efeito.","O Construtor":"Matéria Sólida: converta Pulso em Construtos físicos com Integridade; podem ser dissipados para recuperar Pulso."}},"O Psíquico":{"v":8,"p":5,"i":4,"ch":"Varredura Telepática: em Em Missão, descarte 1 carta ♥ para sondar mentes sem contato visual.","tr":{"O Mentalista":"Rompimento Neural: ataques causam dano Psíquico (ignoram armaduras e coberturas), mas não ferem alvos sem mente biológica.","O Espectro":"Carta Dupla-Face: alterna entre Tangível e Intangível."}},"O Cinético":{"v":11,"p":4,"i":1,"ch":"Massa em Movimento: ao se deslocar 9m (uma zona) no turno gera Inércia: próximo ataque Cinético +1 de dano fixo.","tr":{"O Acrobata":"Domínio Tridimensional: ignora terreno difícil; em posição elevada tem RD 1 corpo a corpo; mergulhos causam Esmagamento.","O Velocista":"Interrupção Temporal: pague +1 Pulso para agir fora da ordem; o gasto é descontado do seu próximo turno natural."}},"O Metamorfo":{"v":14,"p":3,"i":7,"ch":"Plasticidade Celular: em descansos curtos recupera metade do Vigor perdido arredondado para CIMA.","tr":{"O Elementar":"Absorção de Elemento: gaste 1 Pulso (ou Reação) para assumir um Estado Elemental ao tocar uma fonte ou sofrer dano elemental.","O Monstro":"Gatilho da Besta: defina o gatilho (Ferimento Crítico, Adrenalina ou Proteção de Bando). A Forma Monstro dá +2 Vigor Temporário, dano Cinético com Esmagamento e imunidade a medo."}},"O Farol":{"v":14,"p":3,"i":2,"ch":"Presença Inspiradora: uma vez por cena remove medo/pânico/desespero de todos os aliados no setor.","tr":{"O Solar":"Carga Solar: gera Pontos de Brilho (máx. 3) sob luz de um astro ou ao absorver dano Solar/Flamejante; gaste-os livremente no seu turno.","O Cósmico":"Tecelão Gravitacional: gaste 1 Pulso para alterar a gravidade de uma zona (Microgravidade dá Voo aos aliados da zona)."}}};
/* ---- CARTAS DO LIVRO: n=nome c=custo s=naipe t=texto r=raridade a=arquétipo k=trilha b=nascimento x=reação o=sobrecarga ---- */
const CARDS=[{"n":"Golpe de Assinatura","c":2,"s":"espadas","t":"Cause 2 de dano do seu Tipo de Dano Escolhido a um alvo à distância ou em alcance corporal. O alvo sofre a condição tática elemental correspondente.","r":"comum","a":"O Armado","k":"O Portador","b":""},{"n":"Lealdade Bélica","c":2,"s":"espadas","t":"Cause 1 de dano do seu Tipo de Dano Escolhido em uma linha reta de arremesso da sua arma. Ela atinge todos os inimigos presentes e na linha, e ao retornar para você, acerta todos os inimigos adjacentes à mesma linha.","r":"comum","a":"O Armado","k":"O Portador","b":""},{"n":"Mira Cirúrgica","c":1,"s":"ouros","t":"O próximo ataque que você declarar nesta rodada ignora Cobertura Leve e recebe +1 de dano fixo contra alvos desprotegidos.","r":"comum","a":"O Armado","k":"O Portador","b":""},{"n":"Truque Repetido","c":1,"s":"paus","t":"Resgate a última carta aleatória da sua pilha de descarte, se for um golpe, você obrigatoriamente o executa novamente consumindo o Pulso exigido.","r":"comum","a":"O Armado","k":"O Portador","b":""},{"n":"Aparo do Artefato","c":1,"s":"ouros","t":"(Reação) Jogue ao ser alvejado por um projétil. Posicione sua arma em sua frente para absorver 1 de Dano.","r":"comum","a":"O Armado","k":"O Portador","b":"","x":1},{"n":"Redirecionar Energia","c":3,"s":"espadas","t":"(Reação) Quando um oponente lhe atingir com um ataque do mesmo elemento da sua arma, você pode posicioná-la e redirecionar o dano recebido a um oponente à sua escolha.","r":"rara","a":"O Armado","k":"O Portador","b":"","x":1},{"n":"Arremesso Perfurante","c":3,"s":"espadas","t":"Cause 3 de dano do seu Tipo Escolhido. Arremesse sua arma em até 10m em um ataque perfurante que ignora completamente Coberturas Leves e destrói 1 ponto de integridade de Coberturas Pesadas. A arma continuará na zona onde ela caiu e você precisará se movimentar até ela para resgatá-la.","r":"rara","a":"O Armado","k":"O Portador","b":""},{"n":"Impacto em Leque","c":2,"s":"espadas","t":"Arremesse sua arma em arco. Cause 2 de dano do seu Tipo Escolhido no alvo principal e 1 de dano a outro inimigo situado na mesma zona.","r":"rara","a":"O Armado","k":"O Portador","b":""},{"n":"Raio Carregado","c":3,"s":"ouros","t":"Arremesse sua arma para o céu, e escolha um alvo onde ela irá cair. No próximo turno, ela cairá causando 4 de Dano do seu Tipo escolhido.","r":"rara","a":"O Armado","k":"O Portador","b":""},{"n":"“Pegue Isso!”","c":1,"s":"paus","t":"Jogue sua arma para um aliado em um raio de 12m. No próximo turno, ele ganha uma ação extra com o dano padrão do Tipo Escolhido da sua arma, e ela retorna a você.","r":"rara","a":"O Armado","k":"O Portador","b":""},{"n":"Tempestade do Artefato","c":4,"s":"espadas","t":"Gere uma tempestade ao redor da sua arma causando 4 de dano do seu Tipo Escolhido, distribuindo os pontos livremente entre até 3 alvos distintos na mesma zona. Destrói instantaneamente todas as Coberturas Leves presentes na área.","r":"epica","a":"O Armado","k":"O Portador","b":""},{"n":"“Você vai pagar por isso!”","c":4,"s":"espadas","t":"Desfira um disparo ou golpe devastador em alvo único causando 5 de dano do seu Tipo Escolhido. Este ataque ignora quaisquer campos de força, armaduras ou reações defensivas.","r":"epica","a":"O Armado","k":"O Portador","b":""},{"n":"Sobrecarga do Núcleo","c":2,"s":"espadas","t":"(Reação) Salte até o limite de sua movimentação utilizando o impacto da sua arma, ao aterrissar, cause 1 de dano em todos os inimigos que estiverem em zona adjacente. Você pode mirar em barreiras leves ou pesadas para destruí-las.","r":"epica","a":"O Armado","k":"O Portador","b":"","x":1},{"n":"Contra-Ataque Absoluto","c":5,"s":"ouros","t":"(Reação) Absorva todo o dano recebido em sua arma, e o redirecione, junto a 2 de dano do seu Tipo Escolhido diretamente a quem o atacou. Você obrigatoriamente precisa rolar uma tabela de consequências após esse ataque, e qualquer carta relacionado a sua arma fica inutilizável na próxima rodada.","r":"epica","a":"O Armado","k":"O Portador","b":"","x":1},{"n":"Ressonância Perfeita","c":2,"s":"copas","t":"Ative a harmonia máxima com sua arma. Resgate imediatamente 2 cartas da sua pilha de descarte para a sua mão, ignorando o limite padrão de reposição de turno.","r":"epica","a":"O Armado","k":"O Portador","b":""},{"n":"Avanço de Aríete","c":3,"s":"paus","t":"Avance uma linha de 3 zonas em linha reta rompendo qualquer barreira frágil. Cause 2 de dano Cinético no primeiro alvo que encontrar e empurre-o para a zona posterior.","r":"comum","a":"O Armado","k":"O Blindado","b":""},{"n":"Carapaça Rígida","c":1,"s":"ouros","t":"(Reação) Absorva até 2 de dano de um ataque direto sofrido. Se o ataque for do tipo Cinético, reduza o impacto total a zero.","r":"comum","a":"O Armado","k":"O Blindado","b":"","x":1},{"n":"Golpe Pistonado","c":2,"s":"espadas","t":"Cause 2 de dano Cinético a um alvo adjacente corpo a corpo, se o alvo estiver atrás de uma cobertura leve, você quebra a cobertura em cima dele causando +1 de dano dano Cinético.","r":"comum","a":"O Armado","k":"O Blindado","b":""},{"n":"Ancorar Estrutura / Pés de Chumbo","c":1,"s":"ouros","t":"Fixe o chassi no solo. Até o início da próxima rodada, você se torna imune a empurrões, quedas e qualquer efeito de deslocamento forçado.","r":"comum","a":"O Armado","k":"O Blindado","b":""},{"n":"Projétil de Escudo","c":1,"s":"paus","t":"Um fragmento da sua armadura é direcionado a algum aliado, lhe conferindo em -1 de Dano contra qualquer dano cinético recebido na próxima rodada.","r":"comum","a":"O Armado","k":"O Blindado","b":""},{"n":"Purga Térmica","c":2,"s":"espadas","t":"Salte dispersando a energia acumulada pelos impactos recebidos no turno anterior. Todos os alvos adjacentes sofrem (em dano cinético) a mesma quantidade dano (qualquer tipo) que você recebeu no turno anterior.","r":"rara","a":"O Armado","k":"O Blindado","b":""},{"n":"Escudo de Intervenção","c":2,"s":"ouros","t":"(Reação) Intercepte um ataque direcionado a um aliado posicionado na mesma zona. Você sofre o golpe no lugar dele, mas absorve 2 pontos de dano do impacto automaticamente.","r":"rara","a":"O Armado","k":"O Blindado","b":"","x":1},{"n":"Escudo Móvel","c":3,"s":"espadas","t":"Projete uma parte de sua armadura que protegerá um aliado a sua escolha por 2 rodadas. Enquanto estiver ativo, ele ganhará -1 contra golpes cinéticos.","r":"rara","a":"O Armado","k":"O Blindado","b":""},{"n":"Blindagem Reativa / Contra-Choque","c":1,"s":"ouros","t":"(Reação) Jogue ao sofrer um ataque corpo a corpo. Absorva 1 de dano e cause 2 de dano Cinético reflexivo ao agressor.","r":"rara","a":"O Armado","k":"O Blindado","b":"","x":1},{"n":"Arrancada Brusca","c":2,"s":"paus","t":"Dobre sua capacidade de locomoção no turno, ignorando alvos terrestres no caminho.","r":"rara","a":"O Armado","k":"O Blindado","b":""},{"n":"Protocolo Fortaleza","c":4,"s":"ouros","t":"Trave a armadura no terreno. Até o início do seu próximo turno, você e todos os aliados posicionados atrás da sua linha de visão recebem Redução de Dano 2 contra qualquer fonte de ataque, exceto psíquico.","r":"epica","a":"O Armado","k":"O Blindado","b":""},{"n":"Transferência de Armadura","c":3,"s":"espadas","t":"Transfira parte de sua armadura para os membros de um adversário, o imobilizando completamente na próxima rodada.","r":"epica","a":"O Armado","k":"O Blindado","b":""},{"n":"Emissor Ômega","c":3,"s":"espadas","t":"Dispare uma rajada massiva concentrada a partir do núcleo ou magia do traje. Cause 4 de dano Solar puro em linha reta de até 9m contra um alvo principal.","r":"epica","a":"O Armado","k":"O Blindado","b":""},{"n":"Superaquecimento Defensivo","c":3,"s":"ouros","t":"Sua couraça atinge temperaturas extremas ou emana radiação contínua. Durante 2 rodadas, qualquer inimigo que desferir ataques corpo a corpo contra você sofre 2 de dano direto no Vigor.","r":"epica","a":"O Armado","k":"O Blindado","b":""},{"n":"Pulso Vital","c":2,"s":"copas","t":"Os sistemas da armadura ou as runas mágicas ativam para proteção da armadura. Limpe todas as penalidades ativas de lentidão ou danos contínuos.","r":"epica","a":"O Armado","k":"O Blindado","b":""},{"n":"Golpe Desesperado / Troco na Carne","c":1,"s":"espadas","t":"Desfira um ataque brutal corpo a corpo causando 2 de dano Cinético. Se você estiver a metade ou menos do seu Vigor máximo, este ataque ganha +1 de dano fixo.","r":"comum","a":"O Vigilante","k":"O Punitivo","b":""},{"n":"Cicatriz Aberta / Sangue nos Olhos","c":1,"s":"copas","t":"Ignore os efeitos debilitantes de dor. Até o início da próxima rodada, você ignora condições ativas de dano contínuo se estiver com eles, e ganha +1 de Redução de Dano contra o próximo ataque que sofrer.","r":"comum","a":"O Vigilante","k":"O Punitivo","b":""},{"n":"Intimidação Sangrenta","c":1,"s":"copas","t":"Exiba seus próprios ferimentos sem recuar. Um capanga ou oponente adjacente recua 1 zona apavorado e não pode declarar ataques contra você no próximo turno dele.","r":"comum","a":"O Vigilante","k":"O Punitivo","b":""},{"n":"Deslocamento sob Fogo","c":2,"s":"paus","t":"Ignorando a distância, se estiver atrás de uma cobertura, role a outra a sua escolha enquanto atira. O oponente na linha de visão sofre 2 de Dano Cinético.","r":"comum","a":"O Vigilante","k":"O Punitivo","b":""},{"n":"Rosto de Aço","c":1,"s":"ouros","t":"(Reação) Jogue ao sofrer um ataque direto. Absorva 1 de dano. O agressor sofre 1 de dano Cinético imediato caso esteja ao alcance corporal (uma cotovelada reflexa ou cabeçada no nariz).","r":"comum","a":"O Vigilante","k":"O Punitivo","b":"","x":1},{"n":"Sentença de Morte","c":2,"s":"espadas","t":"Desfira um golpe focado em ponto vital causando 3 de dano Cinético. Se este ataque derrubar o alvo a 0 de Vigor, você resgata imediatamente 1 carta da sua pilha de descarte para a mão.","r":"rara","a":"O Vigilante","k":"O Punitivo","b":""},{"n":"Duelo de Exaustão","c":2,"s":"ouros","t":"Trave um inimigo em combate corporal cerrado. Até a próxima rodada, nenhum de vocês pode se mover. Toda vez que ele causar dano a você, ele sofre 2 de dano Cinético reflexivo automático.","r":"rara","a":"O Vigilante","k":"O Punitivo","b":""},{"n":"Disparo de Revide","c":2,"s":"espadas","t":"(Reação) Dispare com uma arma curta logo após sofrer dano à distância. Cause 2 de dano Cinético contra o atirador e force-o a perder a Cobertura Leve em que estava abrigado.","r":"rara","a":"O Vigilante","k":"O Punitivo","b":"","x":1},{"n":"Suportar a Agonia","c":1,"s":"ouros","t":"(Reação) Aplique uma injeção analgésica direto em seu pior ferimento. Você recebe 3 pontos de Vigor Temporário até o encerramento do seu próximo turno.","r":"rara","a":"O Vigilante","k":"O Punitivo","b":"","x":1},{"n":"“Ainda Não Terminei com Você”","c":2,"s":"copas","t":"Agarre um oponente ferido pelo colarinho. Dê 1d6 de Socos seguidos nele. A cada soco, você desfere 1 de Dano Cinético.","r":"rara","a":"O Vigilante","k":"O Punitivo","b":""},{"n":"Massacre Vingativo","c":4,"s":"espadas","t":"Descarregue toda a dor acumulada. Cause 4 de dano Cinético contra um alvo principal e 2 de dano a todos os inimigos adjacentes a ele. Ignora completamente Coberturas Leves e Pesadas da área.","r":"epica","a":"O Vigilante","k":"O Punitivo","b":"","o":1},{"n":"Olho por Olho, Dente por Dente","c":4,"s":"espadas","t":"Declare um ataque corporal devastador: cause um dano igual à quantidade total de Vigor que você perdeu desde o início do combate.","r":"epica","a":"O Vigilante","k":"O Punitivo","b":"","o":1},{"n":"Carnificina Fria","c":3,"s":"copas","t":"Execute uma sequência visceral em um inimigo desorientado. Cause 3 de dano Cinético. Todos os capangas na mesma zona entram em pânico total e abandonam a luta imediatamente.","r":"epica","a":"O Vigilante","k":"O Punitivo","b":""},{"n":"Última Resistência Urbana","c":3,"s":"ouros","t":"Seu corpo entra em transe de combate induzido por adrenalina pura. Durante 2 rodadas completas, todo dano que você sofrer é reduzido em -2 (mínimo de 0), e você não pode ser forçado a descartar cartas da mão.","r":"epica","a":"O Vigilante","k":"O Punitivo","b":""},{"n":"Quebra-Guarda","c":3,"s":"paus","t":"Você tem um bala especial. Aquela bala. Lance um disparo em direção a qualquer tipo de cobertura em um raio de 12m, ela é destruída por seu ataque. Trilha 2: O Pugilista O Pugilista refinou a violência corporal em ciência milimétrica. Ele não depende de armas brancas ou de fogo: seus punhos, canelas, cotovelos e postura compõem um sistema marcial perfeito. No campo de batalha, ele lê o equilíbrio do adversário, dita a cadência dos golpes e transita com fluidez entre abordagens táticas.","r":"epica","a":"O Vigilante","k":"O Punitivo","b":""},{"n":"Cruzado no Queixo","c":2,"s":"espadas","t":"Desfira um golpe contundente causando 2 de dano Cinético corpo a corpo. Se o alvo for um Capanga, ele é nocauteado instantaneamente.","r":"comum","a":"O Vigilante","k":"O Pugilista","b":""},{"n":"Finta e Esquiva","c":1,"s":"paus","t":"(Reação) Jogue ao ser alvejado por um ataque físico. Mova-se 1 passo para o lado e anule até 2 pontos de dano do golpe, esquivando com leveza.","r":"comum","a":"O Vigilante","k":"O Pugilista","b":"","x":1},{"n":"Imobilização Rápida","c":1,"s":"ouros","t":"Cause 1 de dano Cinético e trave os membros de um alvo adjacente. O oponente não pode usar cartas de ataque no próximo turno dele.","r":"comum","a":"O Vigilante","k":"O Pugilista","b":""},{"n":"Jab Repetido / Sequência em Linha","c":1,"s":"espadas","t":"Desfira dois socos rápidos em sucessão. Cause 1 de dano Cinético no alvo e empurre-o 1 passo para trás, rompendo sua postura de guarda.","r":"comum","a":"O Vigilante","k":"O Pugilista","b":""},{"n":"Rasteira de Varrer / Chute Baixo","c":1,"s":"paus","t":"Derrube um adversário adjacente no chão. Ele sofre 1 de dano Cinético e deve gastar sua ação de movimento gratuita na próxima rodada apenas para se levantar.","r":"comum","a":"O Vigilante","k":"O Pugilista","b":""},{"n":"Gancho de Nocaute","c":2,"s":"espadas","t":"Cause 3 de dano Cinético. Se o oponente estiver sem cobertura ou já tiver sofrido dano nesta rodada, ele fica Atordoado e perde o próximo turno.","r":"rara","a":"O Vigilante","k":"O Pugilista","b":""},{"n":"Contra-Golpe Fluido","c":3,"s":"espadas","t":"(Reação) Esquive-se de um ataque corpo a corpo reduzindo o dano sofrido a zero. Imediatamente desfira um contragolpe de 2 de dano Cinético contra o agressor.","r":"rara","a":"O Vigilante","k":"O Pugilista","b":"","x":1},{"n":"Ippon de Asfalto","c":2,"s":"ouros","t":"Use o peso do agressor. Projete um inimigo adjacente com força contra o chão ou contra uma outro inimigo. Cause 2 de dano Cinético no alvo e mais 1 se outro inimigo for atingido.","r":"rara","a":"O Vigilante","k":"O Pugilista","b":""},{"n":"Fileira de Punhos","c":3,"s":"espadas","t":"Atravesse uma linha de 9m desferindo uma série rápida de golpes. Todos os inimigos que estiverem na linha sofrem 2 de dano Cinético.","r":"rara","a":"O Vigilante","k":"O Pugilista","b":""},{"n":"Torção Articular","c":1,"s":"ouros","t":"Torça um membro do oponente com precisão cirúrgica. Cause 1 de dano Cinético ignorando qualquer armadura física e reduza o deslocamento do alvo pela metade até o fim do combate.","r":"rara","a":"O Vigilante","k":"O Pugilista","b":""},{"n":"Golpe de Cento e Oitenta Graus","c":3,"s":"espadas","t":"Um golpe com o peso total do quadril e dos ombros. Cause 4 de dano Cinético maciço em um alvo único e arremesse-o violentamente contra a zona seguinte, rompendo qualquer Cobertura Leve no trajeto.","r":"epica","a":"O Vigilante","k":"O Pugilista","b":""},{"n":"Passo Fantasma / Dança das Sombras","c":2,"s":"paus","t":"Mova-se em uma velocidade superior. Você se torna completamente imune a reações defensivas ou interrupções inimigas nesta rodada.","r":"epica","a":"O Vigilante","k":"O Pugilista","b":""},{"n":"Estrangulamento Sanguíneo","c":3,"s":"copas","t":"Encaixe uma chave de submissão perfeita pelas costas do adversário. Cause 3 de dano direto no Vigor (ignora armaduras e blindagens físicas). O alvo fica incapacitado de falar, dar comandos ou usar cartas de Pulso até que consiga quebrar a pegada.","r":"epica","a":"O Vigilante","k":"O Pugilista","b":""},{"n":"Demolição Muscular","c":3,"s":"espadas","t":"Bata repetidamente nas têmporas e costelas do oponente. Cause 3 de dano Cinético e quebre qualquer bônus ativo de Redução de Dano ou Barreira que o alvo possua até o fim da cena.","r":"epica","a":"O Vigilante","k":"O Pugilista","b":""},{"n":"Transe Marcial Absoluto","c":4,"s":"ouros","t":"Sua mente e seus músculos entram em harmonia perfeita. Durante esta rodada e a próxima, todas as suas cartas de ataque e defesa custam -1 de Pulso (mínimo de 1) e todos os seus golpes ganham +2 de Dano contra qualquer inimigo.","r":"epica","a":"O Vigilante","k":"O Pugilista","b":"","o":1},{"n":"Dardos Místicos em Salva","c":2,"s":"espadas","t":"Dispare 3 projéteis arcanos teleguiados. Cause 1 de dano cinético a até 3 alvos distintos na mesma zona ou concentre todos os 3 pontos de dano em um único oponente desprotegido.","r":"comum","a":"O Arcano","k":"O Conjurador","b":""},{"n":"Égide Refletora","c":2,"s":"ouros","t":"(Reação) Convoque um glifo translúcido ao ser alvejado por um ataque à distância. Absorva 2 de dano do golpe. Se o ataque for de energia pura (Solar, Elétrico ou Flamejante), você pode descartar 1 carta da mão para refletir 1 de dano de volta ao atirador.","r":"comum","a":"O Arcano","k":"O Conjurador","b":"","x":1},{"n":"Encantamento Aliado","c":2,"s":"paus","t":"Encante uma arma de um inimigo, que passa a somar +1 de Dano de dano Sombrio no próximo golpe.","r":"comum","a":"O Arcano","k":"O Conjurador","b":""},{"n":"Raio de Foco Concentrado","c":2,"s":"espadas","t":"Dispare uma linha contínua de energia pura em uma linha reta de até 10m. Cause 2 de dano Solar a um alvo. O ataque ignora Cobertura Leve.","r":"comum","a":"O Arcano","k":"O Conjurador","b":""},{"n":"Transmutar Foco","c":2,"s":"copas","t":"Medite por uma fração de segundo. Resgate 1 carta aleatória da sua pilha de descarte direto para a sua mão, preparando o próximo bombardeio.","r":"comum","a":"O Arcano","k":"O Conjurador","b":""},{"n":"Bombardeio Arcano em Cadeia","c":3,"s":"espadas","t":"Lance uma esfera condensada que implode na zona alvo. Cause 3 de dano Flamejante ao alvo principal e 1 de dano a todos os inimigos adjacentes a ele, espalhando chamas arcanas pelo setor.","r":"rara","a":"O Arcano","k":"O Conjurador","b":""},{"n":"Campo de Ruptura Mágica","c":3,"s":"copas","t":"(Reação) Interrompa a ativação de uma carta de poder ou ataque de energia de um inimigo na sua linha de visão. Force o oponente a pagar +2 de Pulso extra para concluir a ação dele ou a descartar a carta sem efeito.","r":"rara","a":"O Arcano","k":"O Conjurador","b":"","x":1},{"n":"Dobra no Espaço","c":4,"s":"espadas","t":"Ative dois portais interligados em um raio de 18m do cenário. Tanto aliados como inimigos podem atravessá-los. Enquanto eles estiverem ativos, você inicia a rodada com -3 Pulso.","r":"rara","a":"O Arcano","k":"O Conjurador","b":""},{"n":"Escudo Prisma","c":4,"s":"ouros","t":"(Reação) Erga uma cúpula de refração mágica. Anule integralmente o dano de um ataque elemental ou à distância direcionado a você ou a um aliado na mesma zona.","r":"rara","a":"O Arcano","k":"O Conjurador","b":"","x":1},{"n":"Telecinese Vetorial","c":2,"s":"paus","t":"Arremesse um objeto pesado do cenário (um carro, caçamba ou pedaço de pilar) contra um inimigo a até 1 zona. Cause 2 de dano Cinético e empurre o alvo contra uma parede ou cobertura, derrubando-o no chão.","r":"rara","a":"O Arcano","k":"O Conjurador","b":""},{"n":"Supernova Arcana","c":6,"s":"espadas","t":"Libere uma explosão catastrófica de luz sólida e energia primal. Cause 5 de dano Solar em 8m de área a todos os inimigos presentes na sua zona. Pulveriza instantaneamente todas as Coberturas Leves e Pesadas do local.","r":"epica","a":"O Arcano","k":"O Conjurador","b":"","o":1},{"n":"Lança do Julgamento Cósmico","c":4,"s":"espadas","t":"Materialize uma lança de energia pura e arremesse-a contra um alvo único. Cause 5 de dano Mágico perfurante. O golpe ignora completamente reduções de dano, campos de força e armaduras físicas.","r":"epica","a":"O Arcano","k":"O Conjurador","b":""},{"n":"Singularidade Dimensional","c":3,"s":"copas","t":"Abra um microburaco negro em uma zona adjacente. Puxe todos os inimigos e objetos soltos das zonas vizinhas para o centro da fenda, causando 2 de dano Cinético a cada um e deixando-os Imobilizados na próxima rodada.","r":"epica","a":"O Arcano","k":"O Conjurador","b":""},{"n":"Círculo de Dissipação Total","c":5,"s":"ouros","t":"Trace uma barreira mágica no chão. Durante 2 rodadas completas, você e todos os aliados dentro do círculo são imunes a danos Psíquicos, Sombrios ou condições elementais de dano contínuo.","r":"epica","a":"O Arcano","k":"O Conjurador","b":""},{"n":"Chuva de Cometas Místicos","c":5,"s":"espadas","t":"Convoque dezenas de projéteis luminosos que desabam do céu sobre o setor. Distribua 5 pontos de dano flamejante livremente entre todos os alvos hostis visíveis na cena.","r":"epica","a":"O Arcano","k":"O Conjurador","b":""},{"n":"Barreira de Luz Sólida","c":2,"s":"ouros","t":"Erga uma parede translúcida e sólida em uma zona. Ela atua como uma Cobertura Pesada com 3 pontos de Integridade. Enquanto estiver de pé, bloqueia passagens e linhas de tiro inimigas.","r":"comum","a":"O Arcano","k":"O Construtor","b":""},{"n":"Maça de Força","c":1,"s":"espadas","t":"Materialize uma arma geométrica ao redor dos seus punhos. Cause 2 de dano Cinético corpo a corpo em um oponente adjacente.","r":"comum","a":"O Arcano","k":"O Construtor","b":""},{"n":"Plataforma Flutuante / Passarela Rápida","c":1,"s":"paus","t":"Projete degraus ou discos flutuantes sob seus pés ou sob um aliado. Permite cruzar o terreno ignorando terreno perigoso, lama, fogo no chão ou alcançar telhados e andares superiores sem esforço.","r":"comum","a":"O Arcano","k":"O Construtor","b":""},{"n":"Rede de Contenção Geométrica","c":2,"s":"ouros","t":"Dispare faixas de luz sólida que se fecham sobre um alvo a até 1 zona. O inimigo não pode se mover da sua posição atual a menos que gaste sua ação para quebrar a contenção (Integridade 2).","r":"comum","a":"O Arcano","k":"O Construtor","b":""},{"n":"Escudo Pessoal Projetado","c":1,"s":"ouros","t":"(Reação) Convoque um broquel geométrico de força. Absorva até 2 de dano de um ataque físico ou à distância imediato. Se o escudo não quebrar, você pode mantê-lo ativo.","r":"comum","a":"O Arcano","k":"O Construtor","b":"","x":1},{"n":"Sentinela Autônoma de Luz","c":2,"s":"espadas","t":"Modele um pequeno construto flutuante (Integridade 2). Ao ser criado, e em cada turno que você mantê-lo ativo, ele dispara autonomamente um raio de 1 de dano Cinético ou Solar contra o inimigo mais próximo.","r":"rara","a":"O Arcano","k":"O Construtor","b":""},{"n":"Cúpula Protetora Hemisférica","c":4,"s":"ouros","t":"Projete uma redoma impenetrável ao redor de si e de aliados adjacentes. Ela absorve até 4 pontos de dano total de ataques externos antes de quebrar. Aliados dentro da cúpula podem disparar para fora livremente.","r":"rara","a":"O Arcano","k":"O Construtor","b":""},{"n":"Martelo Hidráulico de Luz","c":3,"s":"espadas","t":"Materialize um punho ou martelo gigante suspenso no ar e faça-o desabar sobre uma zona. Cause 2 de dano Cinético em um raio de 6m.","r":"rara","a":"O Arcano","k":"O Construtor","b":""},{"n":"Casamata Tática Modular","c":3,"s":"ouros","t":"(Reação) Quando um aliado na sua linha de visão sofrer um ataque à distância, faça brotar do chão uma parede de contenção que intercepta o ataque no lugar dele, absorvendo até 3 de dano.","r":"rara","a":"O Arcano","k":"O Construtor","b":"","x":1},{"n":"Trancas e Amarras Construtivas","c":2,"s":"copas","t":"Crie travas sólidas ao redor das armas, canos ou braços de um oponente. O alvo fica impedido de realizar ataques corpo a corpo ou disparos pesados até o início da próxima rodada.","r":"rara","a":"O Arcano","k":"O Construtor","b":""},{"n":"Titã de Luz","c":5,"s":"espadas","t":"Modele um construto humanoide colossal que envolve seu corpo ou luta ao seu lado (Integridade 5). Seus ataques corporais passam a causar 4 de dano Cinético permanente enquanto o Golias permanecer ativo no cenário. Se o golias for desfeito, seu personagem fica fora da luta instantaneamente.","r":"epica","a":"O Arcano","k":"O Construtor","b":""},{"n":"Levitação Temporária","c":3,"s":"ouros","t":"Envolve um aliado em uma camada de Luz. Até o próximo turno o deslocamento dele dobra e ele ganha a habilidade de voo.","r":"epica","a":"O Arcano","k":"O Construtor","b":""},{"n":"Canhão Orbital Místico","c":5,"s":"espadas","t":"Materialize um prisma flutuante colossal apontado para a terra. Cause 4 de dano Solar em linha reta de 8m. Qualquer cobertura atingida no trajeto é vaporizada.","r":"epica","a":"O Arcano","k":"O Construtor","b":""},{"n":"Fortaleza de Vetores","c":5,"s":"ouros","t":"Crie uma rede de barreiras entrelaçadas que cobre toda a equipe. Todos os aliados na cena recebem 3 pontos de Barreira Temporária. Enquanto a barreira durar, nenhum aliado pode ser ferido por nenhum golpe, exceto Psíquico, exceto o usuário, que ficará exposto.","r":"epica","a":"O Arcano","k":"O Construtor","b":""},{"n":"Reciclagem de Matéria","c":5,"s":"copas","t":"Colapse instantaneamente todos os seus construtos ativos no mapa em uma implosão controlada. Para cada ponto de integridade restante nos construtos destruídos, recupere 1 carta da sua pilha de descarte para a sua mão ou restaure 1 de Vigor de um aliado adjacente.","r":"epica","a":"O Arcano","k":"O Construtor","b":""},{"n":"Rajada de Ruptura Sináptica","c":2,"s":"copas","t":"Dispare uma onda psíquica contra a mente de um alvo na sua linha de visão. Cause 2 de dano Psíquico direto no Vigor.","r":"comum","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Grito Telepático","c":1,"s":"copas","t":"Projete o som de um colapso ensurdecedor na mente dos adversários adjacentes. Cause 1 de dano Psíquico em área; alvos do escalão Capanga entram em fuga desesperada, recuando para longe de você.","r":"comum","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Fantoche","c":2,"s":"copas","t":"Assuma o controle dos reflexos de um inimigo por um breve instante. Force o alvo a se mover como você quiser, sendo para fora da cobertura dele ou em direção a um perigo ambiental.","r":"comum","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Escudo Mental","c":3,"s":"ouros","t":"(Reação) Jogue quando você ou um aliado na mesma zona for alvo de dano Psíquico, intimidação ou tentativa de controle de ação. Anule integralmente o efeito e absorva até 2 de dano Psíquico.","r":"comum","a":"O Psíquico","k":"O Mentalista","b":"","x":1},{"n":"Névoa da Percepção","c":4,"s":"paus","t":"Apague a sua presença dos sentidos de um oponente. O alvo não pode declarar ataques diretos contra você até o início da próxima rodada, a menos que você ataque primeiro.","r":"comum","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Cirurgia de Sinapses / Lobotomia Psíquica","c":3,"s":"copas","t":"Cause 3 de dano Psíquico direto no Vigor de um alvo. Se este ataque ferir um Tenente ou Vilão, sele uma das habilidades ativas ou cartas da mão dele, impedindo-o de usá-la até o fim do combate.","r":"rara","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Troca de consciência","c":2,"s":"ouros","t":"Troque de mente com um aliado a sua escolha, nesse turno, você assume o baralho dele, mas com seu teto de Pulso.","r":"rara","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Drenagem de Pulso","c":1,"s":"copas","t":"Drene até 3 do Pulso de um inimigo corpo-a-corpo para seu herói. O valor drenado conta como extra até a próxima rodada.","r":"rara","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Elo Telepático","c":1,"s":"ouros","t":"Conecte a mente da equipe. Dentro do seu turno, você pode trocar o naipe das cartas de seus aliados, gastando +1 Pulso pra cada carta sua ou de seu aliado que deseja trocar o naipe.","r":"rara","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Palco de Ilusões","c":5,"s":"paus","t":"Altere a percepção de realidade de um grupo de alvos. Você invoca uma fumaça ilusória que disfarça seus aliados por até 3 turnos. Enquanto você estiver projetando a ilusão, seu corpo está em transe e indefeso, caso seja atingido, você entra em estado de agonia.","r":"rara","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Espelho Sombrio","c":4,"s":"copas","t":"Replique e clone um golpe desferido por um tentente ou vilão contra ele mesmo.","r":"epica","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Devorador de Mentes","c":3,"s":"copas","t":"Aliene uma rede de inimigos. Escolha um alvo, a cada inimigo que estiver ao menos 2m adjacente do alvo escolhido forma uma linha até o próximo. Ao final, todos os inimigos conectados sofrem 3 de dano psíquico.","r":"epica","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Sobrecarga Telepática Global","c":4,"s":"espadas","t":"Libere uma explosão de energia psíquica pura que rompe carne e matéria. Cause 3 de dano Psíquico em todos os inimigos da zona e 2 de dano Cinético nas estruturas físicas ao redor.","r":"epica","a":"O Psíquico","k":"O Mentalista","b":"","o":1},{"n":"Possessão Temporal Total","c":3,"s":"copas","t":"Assuma o controle absoluto do corpo de um Tenente ou Capanga por até 3 rodadas inteira. Você executa o turno dele como se fosse seu, usando as ações dele contra as forças inimigas antes de devolvê-lo ao próprio corpo desnorteado. Enquanto você estiver assumindo a mente dele, seu corpo está em transe e indefeso, caso seja atingido, você entra em estado de agonia.","r":"epica","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Santuário Astral","c":4,"s":"ouros","t":"Erga uma cúpula psíquica protetora. Durante 2 rodadas completas, nenhum aliado dentro da sua zona pode ter cartas descartadas forçadamente, sofrer condições mentais ou ser afetado por dano Psíquico e Sombrio.","r":"epica","a":"O Psíquico","k":"O Mentalista","b":""},{"n":"Golpe de Densidade Súbita","c":3,"s":"espadas","t":"(Exige estar Tangível) Solidifique seus punhos no momento do impacto. Cause 2 de dano Sombrio. Se você virou para a face Tangível nesta mesma rodada, o ataque pega o alvo desprevenido e causa +1 de dano fixo.","r":"comum","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Vácuo Corporal","c":3,"s":"paus","t":"(Reação) Jogue quando for alvejado por um ataque físico ou balístico e estivar tangível. Vire sua carta para a face Intangível imediatamente: o projétil ou golpe passa direto pelo seu corpo sem causar dano.","r":"comum","a":"O Psíquico","k":"O Espectro","b":"","x":1},{"n":"Passo Espectral / Atravessar Matéria","c":1,"s":"paus","t":"(Exige estar Intangível) Mova-se atravessando livremente paredes reforçadas, portas trancadas, barricadas e corpos de oponentes sem ser bloqueado por terreno difícil. A cada oponente que você passar sofre 1 de Dano Sombrio.","r":"comum","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Toque Gélido da Sepultura","c":2,"s":"espadas","t":"(Exige estar Intangível) Toque um alvo passando parcialmente seus dedos pela carne dele. Cause 1 de dano Congelante que ignora armaduras físicas e reduz o deslocamento do oponente em 1 passo na rodada seguinte.","r":"comum","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Distorção Translúcida","c":3,"s":"ouros","t":"(Exige estar tangível) De frente a um oponente, se torna intangível para brincar com seus sentidos e o acertar quando estiver despercebido, desferindo 1d6 de dano cinético.","r":"comum","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Trava Molecular","c":2,"s":"espadas","t":"(Exige estar Intangível) Passe sua mão por dentro da arma, armadura ou membro de um oponente e materialize-se ligeiramente. Cause 2 de dano Cinético interno direto no Vigor e desarme ou quebre a proteção física do alvo.","r":"rara","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Arrasto Intangível","c":2,"s":"paus","t":"(Exige estar tangível) Agarre um aliado ou civil e estenda sua frequência vibratória a ele. Mova você e o companheiro 1 zona atravessando barreiras sólidas. O aliado fica protegido contra ataques físicos durante o trajeto.","r":"rara","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Ruptura de Chassi por Curto-Circuito","c":2,"s":"espadas","t":"(Exige estar Intangível) Atravesse um construto mecânico, robô ou chassi de armadura blindada enquanto intangível. A interferência molecular gera uma pane catastrófica: cause 3 de dano Elétrico direto no construto ou ignore toda a Redução de Dano do traje dele.","r":"rara","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Aparição Fantasmagórica","c":2,"s":"ouros","t":"(Exige estar Intangível) Apareça atrás de um oponente direcionando sua atenção a você. Durante o restante do turno, ataque dos seus aliados à aquele oponente recebem +1 de Dano.","r":"rara","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Vigilância Fora de Fase","c":1,"s":"copas","t":"(Exige estar intangível) Mergulhe no chão ou no teto, ficando completamente oculto e intangível. Resgate 1 carta da sua pilha de descarte para a sua mão enquanto observa a movimentação inimiga sem ser visto.","r":"rara","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Foice Fria","c":5,"s":"espadas","t":"(Exige estar Intangível) Atravesse o tronco do adversário e materialize parcialmente os dedos em torno de um órgão vital. Cause 4 de dano Sombrio direto no Vigor, ignorando armaduras, campos de força e reações defensivas. O alvo cai de joelhos em Estado de Agonia caso fique com 3 ou menos de Vigor.","r":"epica","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Dobra Espectral Coletiva","c":5,"s":"ouros","t":"(Exige estar tangível) Expanda seu campo vibratório em uma bolha ao redor de toda a equipe na mesma zona. Durante 1 rodada inteira, todos os heróis aliados compartilham a condição Intangível: tiros e explosões mundanas atravessam o grupo sem feri-los.","r":"epica","a":"O Psíquico","k":"O Espectro","b":"","o":1},{"n":"Massa Hiperdensa / Impacto de Meteoro","c":3,"s":"espadas","t":"(Exige estar Intangível) Vire subitamente para a face Tangível, multiplicando sua densidade molecular para o peso de chumbo maciço ao cair sobre uma zona. Cause 4 de dano Cinético em área e destrua todas as Coberturas Leves e Pesadas do setor sob o impacto do seu peso desmedido.","r":"epica","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Terror Ectoplásmico","c":3,"s":"copas","t":"(Exige estar Intangível) Cruze 12m sobre múltiplos oponentes como uma assombração translúcida. Todos os inimigos atingidos sofrem 2 de dano Sombrio e ficam Paralisados de pavor por 1 rodada (incapazes de declarar reações defensivas).","r":"epica","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Desvanecimento Absoluto","c":4,"s":"paus","t":"(Exige estar tangível) Desfaça completamente sua assinatura física por uma rodada inteira. Você remove todas as condições negativas de dano contínuo, limpa lentidões e reaparece em qualquer ponto visível do cenário na rodada seguinte com sua mão de cartas totalmente renovada.","r":"epica","a":"O Psíquico","k":"O Espectro","b":""},{"n":"Salto com Mergulho","c":2,"s":"espadas","t":"Salte de uma posição elevada ou parede. Cause 2 de dano Cinético contra um alvo e empurre-o 1 passo para trás. Se você tiver Inércia ativa, o alvo é derrubado no chão.","r":"comum","a":"O Cinético","k":"O Acrobata","b":""},{"n":"Pêndulo","c":1,"s":"paus","t":"(Reação) Jogue ao ser alvejado por um projétil ou golpe. Reposicione-se em até 6m para uma cobertura ou zona vertical e anule até 2 de dano do ataque.","r":"comum","a":"O Cinético","k":"O Acrobata","b":"","x":1},{"n":"Impulso em Ricochete","c":1,"s":"paus","t":"Chute uma parede, pilar ou carro para ganhar tração. Mova-se 6m a mais e resgate 1 carta da sua pilha de descarte para o fundo do seu baralho.","r":"comum","a":"O Cinético","k":"O Acrobata","b":""},{"n":"Rasteira Aérea","c":1,"s":"espadas","t":"Atinja as pernas de um adversário no solo. Cause 1 de dano Cinético e force o alvo a perder sua ação no próximo turno.","r":"comum","a":"O Cinético","k":"O Acrobata","b":""},{"n":"Amarrado aos Ares","c":2,"s":"copas","t":"Use suas cordas ou cabos para prender o inimigo a uma superfície alta. Ele deve gastar um turno para se soltar, e sofrerá 1 dano Cinético devido a queda caso o fizer.","r":"comum","a":"O Cinético","k":"O Acrobata","b":""},{"n":"Estilingue!","c":2,"s":"paus","t":"Force uma física de estilingue com suas cordas para se lançar em velocidade a algum inimigo. A cada 2m de distância entre vocẽ e seu inimigo, é acrescentado +1 de Dano Cinético.","r":"rara","a":"O Cinético","k":"O Acrobata","b":""},{"n":"Redirecionamento Cinético / Giro de Força","c":2,"s":"ouros","t":"(Reação) Use a força de um ataque corpo a corpo inimigo contra ele mesmo. Anule o dano sofrido e arremesse o agressor contra uma Cobertura Leve ou Pesada na mesma zona, causando 2 de dano Cinético a ele.","r":"rara","a":"O Cinético","k":"O Acrobata","b":"","x":1},{"n":"Chute em Gancho Triplo","c":2,"s":"espadas","t":"Execute uma sequência aérea giratória. Cause 2 de dano Cinético no alvo principal e 1 de dano a outro inimigo adjacente, quebrando qualquer Cobertura Leve que proteja ambos.","r":"rara","a":"O Cinético","k":"O Acrobata","b":""},{"n":"Equilíbrio de Fio de Navalha","c":1,"s":"ouros","t":"(Reação) Jogue quando for sofrer uma condição de Atordoamento, Queda ou Empurrão forçado. Anule o efeito completamente e pouse com perfeição sobre os próprios pés.","r":"rara","a":"O Cinético","k":"O Acrobata","b":"","x":1},{"n":"Rede de Apoio","c":1,"s":"paus","t":"(Reação) Lance cabos, cordas ou faça um resgate aéreo rápido. Mova você e um aliado adjacente para uma posição segura a até 10m de distância, retirando-o de uma área de perigo ou fogo.","r":"rara","a":"O Cinético","k":"O Acrobata","b":"","x":1},{"n":"Mergulho Meteórico / O Vôo do Falcão","c":4,"s":"espadas","t":"Caia em velocidade terminal do topo do cenário sobre uma zona. Cause 4 de dano Cinético contra um alvo principal e 2 de dano em área a todos os inimigos adjacentes. Pulveriza todas as Coberturas Leves do ponto de impacto.","r":"epica","a":"O Cinético","k":"O Acrobata","b":""},{"n":"Coreografia da Esquiva Perfeita","c":4,"s":"paus","t":"Durante 2 rodadas completas, você não pode ser atingido por ataques cinéticos; você simplesmente desvia saltando entre as balas com fluidez absoluta.","r":"epica","a":"O Cinético","k":"O Acrobata","b":""},{"n":"Varredura Giratória","c":3,"s":"espadas","t":"Gire com os pés estendidos em meio a um grupo. Cause 3 de dano Cinético a até 3 oponentes na mesma zona e force todos a caírem no chão desorientados.","r":"epica","a":"O Cinético","k":"O Acrobata","b":""},{"n":"Finta Impossível","c":2,"s":"copas","t":"Execute um movimento corporal que desafia os reflexos do oponente. Cancele todas as cartas de reação ativas na mesa do inimigo e compre imediatamente 2 cartas do seu baralho.","r":"epica","a":"O Cinético","k":"O Acrobata","b":""},{"n":"Catapulta Urbana","c":3,"s":"espadas","t":"Prenda as mãos ou impulsione um aliado pesado contra a linha inimiga. O aliado avança 10m e desfere um ataque corpo a corpo gratuito com +2 de dano fixo no impacto, podendo somar a alguma carta de dano que ele tiver em mãos.","r":"epica","a":"O Cinético","k":"O Acrobata","b":""},{"n":"Golpe de Centelha / Toque Supersônico","c":2,"s":"espadas","t":"Cruze a sala e desfira um soco em velocidade acelerada. Cause 2 de dano Elétrico. O alvo perde o deslocamento na rodada seguinte devido à desorientação.","r":"comum","a":"O Cinético","k":"O Velocista","b":""},{"n":"Desvio por Milésimo","c":1,"s":"paus","t":"(Reação) Jogue quando for alvejado. Saia da linha de tiro em um rastro de luz, anulando até 2 de dano do ataque e reposicionando-se 1 zona para qualquer direção desimpedida.","r":"comum","a":"O Cinético","k":"O Velocista","b":"","x":1},{"n":"Varredura em Flash","c":4,"s":"paus","t":"Corra por uma zona inteira recolhendo objetos ou desarmando capangas. Retire 1 arma de mão de um oponente comum ou reposicione um civil em perigo para trás de uma Cobertura Pesada.","r":"comum","a":"O Cinético","k":"O Velocista","b":""},{"n":"Vácuo de Vento","c":2,"s":"ouros","t":"Gire os braços gerando um turbilhão. Absorva 1 de dano de ataques de projéteis ou apague chamas e disperse gases tóxicos em uma zona inteira.","r":"comum","a":"O Cinético","k":"O Velocista","b":""},{"n":"Esteira Estática","c":3,"s":"ouros","t":"Acumule fricção no piso. Não se movimente durante essa rodada, e seu próximo ataque ganha o +2 de dano Elétrico. Cartas Raras (O Velocista)","r":"comum","a":"O Cinético","k":"O Velocista","b":""},{"n":"Sequência de Mil Golpes","c":3,"s":"espadas","t":"Desfira dezenas de socos e pontapés em frações de segundo. Cause 1d6 de dano Cinético em um único alvo ou divida esse dano em 1 ponto para os inimigos diferentes espalhados pelo mapa.","r":"rara","a":"O Cinético","k":"O Velocista","b":""},{"n":"Rastro Residual / Miragem de Velocidade","c":3,"s":"paus","t":"(Reação) Deixe para trás um eco estático que recebe o golpe no seu lugar. Anule totalmente o ataque inimigo. Você reaparece atrás do agressor pronto para revidar.","r":"rara","a":"O Cinético","k":"O Velocista","b":"","x":1},{"n":"Ciclone de Sucção","c":2,"s":"copas","t":"Corra em círculos fechados ao redor de uma zona de 3x3, sugando o oxigênio e levantando entulho. Todos os inimigos na área sofrem 1 de dano Elétrico e ficam sisolados na área por 1 rodada.","r":"rara","a":"O Cinético","k":"O Velocista","b":""},{"n":"Resgate em Câmara Lenta","c":2,"s":"ouros","t":"(Reação) Interrompa o ataque contra um aliado na sua linha de visão. Corra até ele, retire-o da trajetória do golpe e mova vocês dois até 20m zonas de distância antes do disparo atingir o solo.","r":"rara","a":"O Cinético","k":"O Velocista","b":"","x":1},{"n":"Soco de Massa Infinita","c":3,"s":"espadas","t":"Acelere ao redor do quarteirão para converter velocidade pura em massa relativa. Cause 4 de dano Cinético em um alvo único e arremesse-o como uma bala de canhão, se ele estiver adjacente a uma cobertura, ele arrebenta ela e toma +1 de dano.","r":"rara","a":"O Cinético","k":"O Velocista","b":""},{"n":"Parada Relativa do Tempo / O Segundo Infinito","c":3,"s":"paus","t":"Entre em uma frequência temporal tão extrema que todos na cena parecem estátuas. Você pode jogar até 2 cartas adicionais da sua mão imediatamente sem pagar o custo de Pulso delas. Após isso, você perde a supervelocidade pelo próximo turno.","r":"epica","a":"O Cinético","k":"O Velocista","b":""},{"n":"Tempestade de Raios Bioelétricos","c":4,"s":"espadas","t":"Arremesse o excesso de eletricidade estática acumulada pelos seus passos. Cause 3 de dano Elétrico a todos os inimigos presentes na cena, sobrecarregando armas de fogo, drones e circuitos mecânicos.","r":"epica","a":"O Cinético","k":"O Velocista","b":""},{"n":"Deslocamento Molecular por Fricção","c":3,"s":"ouros","t":"Vibre o corpo em uma frequência que dissipa energia pura. Durante 2 rodadas completas, você se torna imune a condições de dano contínuo (fogo, toxinas, congelamento) e atravessa obstáculos físicos sólidos livremente.","r":"epica","a":"O Cinético","k":"O Velocista","b":""},{"n":"Reversão Temporal","c":10,"s":"copas","t":"(Reação) Corra contra o fluxo da física para desfazer o último acontecimento trágico. Anule o ataque fatal que acabou de colocar um aliado em Agonia ou restaure uma cobertura estrutural destruída há poucos segundos. ATENÇÃO: Esse poder é extremamente perigoso. Caso o herói opte por usá-lo, ele precisa rolar 1d6. Se o resultado não cair em 6, o herói reverte o acontecimento, mas se desfaz na corrida e deixa de existir.","r":"epica","a":"O Cinético","k":"O Velocista","b":"","x":1,"o":1},{"n":"Corrida Sem Fim","c":2,"s":"paus","t":"Renove seu metabolismo ao limite da velocidade celular. Troque 3 cartas imediatamente do seu baralho e limpe todas as penalidades ativas de sobrecarga do seu herói.","r":"epica","a":"O Cinético","k":"O Velocista","b":""},{"n":"Golpe de Matéria Pura","c":2,"s":"espadas","t":"Desfira um ataque corporal com seus membros convertidos no elemento ativo. Cause 2 de dano do Tipo Elemental absorvido e aplique a condição tática correspondente ao oponente.","r":"comum","a":"O Metamorfo","k":"O Elementar","b":""},{"n":"Condensação Rápida / Mimetismo Reflexo","c":1,"s":"ouros","t":"(Reação) Jogue ao ser alvejado por um ataque elemental ou físico próximo a uma fonte do cenário. Assuma o elemento do ataque imediatamente, absorvendo 2 de dano do impacto.","r":"comum","a":"O Metamorfo","k":"O Elementar","b":"","x":1},{"n":"Fluidez de Estado / Deslocamento Amorfo","c":1,"s":"paus","t":"Converta-se em água, gás, corrente elétrica ou poeira para se mover 9m. Ignora completamente inimigos no solo, grades de metal e frestas estreitas.","r":"comum","a":"O Metamorfo","k":"O Elementar","b":""},{"n":"Projétil Desprendido","c":1,"s":"espadas","t":"Destaque um fragmento do próprio corpo (uma lasca de rocha afiada, uma bola de fogo viva ou espinho de gelo) e lance a até em um raio de 3m. Cause 1 de dano do elemento ativo.","r":"comum","a":"O Metamorfo","k":"O Elementar","b":""},{"n":"Fusão com o Cenário","c":1,"s":"ouros","t":"Mergulhe na mesma matéria de uma Cobertura adjacente (concreto, metal ou terra). Até sua próxima ação, você se torna indistinguível da estrutura, recebendo Redução de Dano 2.","r":"comum","a":"O Metamorfo","k":"O Elementar","b":""},{"n":"Erupção Corporal","c":2,"s":"espadas","t":"Disperse o elemento ativo em uma onda violenta ao redor de si. Cause 2 de dano em área do Tipo Elemental absorvido a todos os alvos adjacentes e empurre-os 1 passo para trás.","r":"rara","a":"O Metamorfo","k":"O Elementar","b":""},{"n":"Drenagem Ambiental","c":2,"s":"ouros","t":"Consuma a matéria de uma Cobertura Leve ou Pesada adjacente feita do mesmo elemento que você mimetiza. Destrua a cobertura para recuperar 2 pontos de Vigor Temporário de imediato.","r":"rara","a":"O Metamorfo","k":"O Elementar","b":""},{"n":"Muralha Viva","c":2,"s":"ouros","t":"(Reação) Expanda seu corpo diante de um aliado na mesma zona para interceptar um ataque, assumindo a consistência de uma Cobertura Elemental Pesada (absorve até 3 de dano).","r":"rara","a":"O Metamorfo","k":"O Elementar","b":"","x":1},{"n":"Choque de Transição / Choque Térmico","c":2,"s":"espadas","t":"Mude repentinamente de um estado elemental para outro oposto (ex: de gelo para chamas ou de rocha para eletricidade). Cause 3 de dano no alvo em combate corpo a corpo, rompendo armaduras físicas.","r":"rara","a":"O Metamorfo","k":"O Elementar","b":""},{"n":"Rastro Cáustico / Chão Perigoso","c":1,"s":"paus","t":"Ao se deslocar, deixe um rastro do seu elemento no piso (poças de ácido, gelo escorregadio ou brasas vivas). A área se torna terreno perigoso por 2 rodadas (causa 1 de dano a quem entrar).","r":"rara","a":"O Metamorfo","k":"O Elementar","b":""},{"n":"Cataclismo Vivo","c":4,"s":"espadas","t":"Aumente sua escala elemental para proporções monumentais. Destrua todas as Coberturas Leves do local.","r":"epica","a":"O Metamorfo","k":"O Elementar","b":"","o":1},{"n":"Vaporização / Estado Gasoso Absoluto","c":3,"s":"ouros","t":"Seu corpo desfaz a coesão física em névoa ou fumaça densa por 2 rodadas. Você se torna imune a dano Cinético e projéteis mundanos, e seus golpes assumem dano Congelante.","r":"epica","a":"O Metamorfo","k":"O Elementar","b":""},{"n":"Pulso de Condução em Massa","c":3,"s":"espadas","t":"Conecte seu elemento a todas as estruturas condutoras da cena (canos, fiação, poças d'água). Distribua 5 pontos de dano do seu elemento entre alvos hostis em contato com essas estruturas.","r":"epica","a":"O Metamorfo","k":"O Elementar","b":""},{"n":"Estalagmites Elementais","c":2,"s":"copas","t":"Você atinge o chão gerando estalagmites elementais do chão, os espinhos podem servir de proteção natural ao usuário, e repelem inimigos em áreas adjacentes com dano do elemento.","r":"epica","a":"O Metamorfo","k":"O Elementar","b":""},{"n":"Prisão de Matéria Cristalina / Fóssil Instantâneo","c":3,"s":"ouros","t":"Envolva um oponente em pedra maciça, âmbar biológico ou gelo denso. O alvo fica Paralisado por 1 rodada inteira e perde todas as reações defensivas até que a carcaça seja quebrada (Integridade 3).","r":"epica","a":"O Metamorfo","k":"O Elementar","b":""},{"n":"Patada Brutal / Dilaceração","c":2,"s":"espadas","t":"Desfira um golpe com garras, cauda ou punhos hipertrofiados. Cause 3 de dano Cinético corpo a corpo e empurre o alvo 1 passo para trás.","r":"comum","a":"O Metamorfo","k":"O Monstro","b":""},{"n":"Rugido Aterrador","c":1,"s":"copas","t":"Solte um bramido ensurdecedor. Todos os capangas na mesma zona recuam 1 zona apavorados; tenentes e vilões perdem 1 de Pulso na iniciativa seguinte deles.","r":"comum","a":"O Metamorfo","k":"O Monstro","b":""},{"n":"Carne Grossa / Couraça Espessa","c":1,"s":"ouros","t":"(Reação) Enrijeça os músculos ou espinhos dérmicos ao sofrer um ataque corporal ou balístico. Absorva até 3 de dano direto.","r":"comum","a":"O Metamorfo","k":"O Monstro","b":"","x":1},{"n":"Salto Predatório","c":1,"s":"paus","t":"Agache-se e salte uma distância de até 15m, caindo diretamente adjacente a uma presa. Destrói Coberturas Leves no ponto de queda.","r":"comum","a":"O Metamorfo","k":"O Monstro","b":""},{"n":"Mordida Voraz / Presa Trancada","c":1,"s":"espadas","t":"Tranque as mandíbulas em um membro do inimigo. Cause 2 de dano Cinético e deixe o alvo preso à sua posição (ele não pode usar cartas de ♣ Paus para fugir).","r":"comum","a":"O Metamorfo","k":"O Monstro","b":""},{"n":"Arremesso de Presa","c":3,"s":"espadas","t":"Agarre um adversário adjacente pelo tronco e lance-o contra outro inimigo ou contra uma Cobertura Pesada a até 1 zona. Cause 3 de dano Cinético no alvo arremessado e 2 de dano na estrutura/inimigo atingido.","r":"rara","a":"O Metamorfo","k":"O Monstro","b":""},{"n":"Frenesi Descontrolado","c":3,"s":"espadas","t":"Desfira uma sequência selvagem de mordidas e pancadas. Cause 3 de dano Cinético em um único alvo. Se você estiver na Forma Monstro, este ataque ganha +1 de dano fixo adicional.","r":"rara","a":"O Metamorfo","k":"O Monstro","b":""},{"n":"Regeneração Selvagem","c":2,"s":"ouros","t":"(Reação) Descarte essa +1 carta da sua mão direto para o descarte. Feche ferimentos abertos instantaneamente, recuperando 2 de Vigor real no calor da luta.","r":"rara","a":"O Metamorfo","k":"O Monstro","b":"","x":1},{"n":"Investida Demolidora","c":3,"s":"paus","t":"Avance em disparada rompendo tudo à frente. Cause 3 de dano Cinético no primeiro alvo do caminho e esmague qualquer Cobertura (Leve ou Pesada) presente no trajeto.","r":"rara","a":"O Metamorfo","k":"O Monstro","b":""},{"n":"Terremoto Monstruoso","c":1,"s":"ouros","t":"Desfira golpes furiosos no chão causando terremotos poderosos. Cada alvo, incluindo","r":"rara","a":"O Metamorfo","k":"O Monstro","b":""},{"n":"Fúria Primitiva Desatada / O Predador Alfa","c":4,"s":"espadas","t":"Perca totalmente a racionalidade civil em um surto de violência pura. Cause 6 de dano Cinético direto em um alvo único, esmagando blindagens e ignorando qualquer reação defensiva do oponente.","r":"epica","a":"O Metamorfo","k":"O Monstro","b":"","o":1},{"n":"Pisotão Sísmico / Fenda no Asfalto","c":3,"s":"espadas","t":"Bata as duas patas ou punhos no solo com força tectônica. Cause 3 de dano Cinético em todos os alvos terrestres na zona atual e derrube todos no chão.","r":"epica","a":"O Metamorfo","k":"O Monstro","b":""},{"n":"Imortalidade Bestial / Negar a Queda","c":3,"s":"ouros","t":"(Reação) Jogue no momento exato em que sofrer um ataque que reduziria seu Vigor a 0. Em vez de cair em Agonia, seu Vigor é fixado em 1, você ganha 3 de Vigor Temporário e entra imediatamente na Forma Monstro com sede de sangue.","r":"epica","a":"O Metamorfo","k":"O Monstro","b":"","x":1},{"n":"Frenesi de Bando / Carnificina em Área","c":3,"s":"espadas","t":"Gire despedaçando o que estiver ao alcance. Cause 2 de dano Cinético a cada inimigo presente na mesma zona, deixando todos com a condição Sangrando (1 de dano no Vigor por rodada).","r":"epica","a":"O Metamorfo","k":"O Monstro","b":""},{"n":"Metabolismo Colossal","c":2,"s":"copas","t":"Seu organismo expele toxinas, dardos e tranquilizantes através do suor e da bile. Remova todas as condições negativas e resgate imediatamente 2 cartas de ♠ Espadas da sua pilha de descarte para a sua mão.","r":"epica","a":"O Metamorfo","k":"O Monstro","b":""},{"n":"Visão Térmica / Feixe Ocular","c":2,"s":"espadas","t":"Dispare dois feixes concentrados de calor pelos olhos ou mãos. Cause 2 de dano Solar direto em um alvo à distância. Este ataque ignora Coberturas Leves e quebra 1 ponto de integridade de Coberturas Pesadas.","r":"comum","a":"O Farol","k":"O Solar","b":""},{"n":"Aura Radiante / Fulgor Protetor","c":1,"s":"ouros","t":"(Reação) Libere um clarão de luz súbita ao ser alvejado. Absorva até 2 de dano do impacto e cegue temporariamente o agressor até o final da rodada dele.","r":"comum","a":"O Farol","k":"O Solar","b":"","x":1},{"n":"Ascensão aos Céus / Decolagem Rápida","c":1,"s":"paus","t":"Ligue seu modo de Voo em uma arrancada súbita. Mova-se até 2 zonas ignorando quaisquer obstáculos de solo, fossos ou chamas e gere 1 Ponto de Brilho.","r":"comum","a":"O Farol","k":"O Solar","b":""},{"n":"Soco de Forja Estelar","c":1,"s":"espadas","t":"Desfira um golpe corporal desarmado revestido de calor puro. Cause 2 de dano Cinético ou Flamejante contra um alvo adjacente.","r":"comum","a":"O Farol","k":"O Solar","b":""},{"n":"Chama Restauradora","c":1,"s":"copas","t":"Abra os braços em direção ao horizonte. Recupere 2 pontos de Vigor Temporário e adicione 1 Ponto de Brilho à sua reserva de Carga Solar.","r":"comum","a":"O Farol","k":"O Solar","b":""},{"n":"Sopro Ártico / Choque Térmico","c":2,"s":"espadas","t":"Exale uma rajada de vento glacial comprimido. Cause 2 de dano Congelante a um alvo e congele o piso ao redor dele, deixando-o Imobilizado na próxima rodada.","r":"rara","a":"O Farol","k":"O Solar","b":""},{"n":"Interceptação Heroica / O Peito de Aço","c":2,"s":"ouros","t":"(Reação) Voe para a frente de um aliado que acaba de sofrer um ataque à distância. Você recebe o impacto no lugar dele, absorvendo automaticamente 3 pontos de dano com seu peitoral invulnerável.","r":"rara","a":"O Farol","k":"O Solar","b":"","x":1},{"n":"Erupção Solar Concentrada","c":2,"s":"espadas","t":"Libere uma explosão de calor em 360 graus. Cause 2 de dano Solar em todos os oponentes adjacentes e empurre-os 1 zona para trás.","r":"rara","a":"O Farol","k":"O Solar","b":""},{"n":"Visão de Raio-X / Varredura Celular","c":1,"s":"copas","t":"Examine o interior de um inimigo ou estrutura. O próximo ataque desferido por qualquer herói contra esse alvo nesta rodada ignora completamente armaduras e escudos.","r":"rara","a":"O Farol","k":"O Solar","b":""},{"n":"Mergulho Supersônico / Martelo dos Céus","c":3,"s":"espadas","t":"Mergulhe do céu em alta velocidade como um meteoro. Cause 3 de dano Cinético contra um alvo no solo e destrua a Cobertura Pesada onde ele estava abrigado.","r":"rara","a":"O Farol","k":"O Solar","b":""},{"n":"Supernova Solar / O Clímax do Meio-Dia","c":4,"s":"espadas","t":"Descarregue toda a energia nuclear armazenada nas células. Cause 4 de dano Solar em todos os alvos hostis da zona atual. Vaporiza instantaneamente todas as coberturas da área.","r":"epica","a":"O Farol","k":"O Solar","b":"","o":1},{"n":"Invulnerabilidade Absoluta","c":3,"s":"ouros","t":"Seu corpo atinge a densidade de uma estrela anã. Durante 2 rodadas completas, todo dano direto sofrido por você é reduzido em -3 (mínimo de 0), e você se torna imune a qualquer condição de deslocamento forçado.","r":"epica","a":"O Farol","k":"O Solar","b":""},{"n":"Salto para a Estratosfera","c":3,"s":"paus","t":"Voe além das nuvens para se banhar na radiação espacial por um instante. Você limpa todas as condições negativas de dano contínuo, recupera 4 de Vigor real e resgata 2 cartas de ♠ Espadas do descarte para a mão.","r":"epica","a":"O Farol","k":"O Solar","b":""},{"n":"Feixe Incandescente Perfurador","c":3,"s":"espadas","t":"Foque toda a visão térmica em um raio contínuo de calor cirúrgico. Cause 5 de dano Solar a um único alvo, ignorando quaisquer campos de força ou armaduras físicas.","r":"epica","a":"O Farol","k":"O Solar","b":""},{"n":"O Símbolo da Esperança","c":2,"s":"copas","t":"Erga-se radiante no centro da batalha. Todos os aliados caídos em Estado de Agonia na mesma zona recuperam a consciência imediatamente com 1 de Vigor, e a equipe inteira recebe +1 de Pulso extra no próximo turno.","r":"epica","a":"O Farol","k":"O Solar","b":""},{"n":"Pulso de Gravidade Repulsora","c":2,"s":"espadas","t":"Dispare uma onda cinético-cósmica invisível. Cause 2 de dano Cinético contra um alvo a até 1 zona de distância e empurre-o violentamente contra uma parede ou cobertura.","r":"comum","a":"O Farol","k":"O Cósmico","b":""},{"n":"Bolha de Força / Égide Quântica","c":1,"s":"ouros","t":"(Reação) Convoque uma barreira translúcida de energia pura. Absorva 2 de dano de um ataque imediato contra você ou um aliado adjacente.","r":"comum","a":"O Farol","k":"O Cósmico","b":"","x":1},{"n":"Voo Inercial / Planar no Vácuo","c":1,"s":"paus","t":"Mova-se 1 zona flutuando com calma e precisão. Você pode carregar 1 aliado ou objeto pesado junto consigo sem penalidade de movimento.","r":"comum","a":"O Farol","k":"O Cósmico","b":""},{"n":"Raio de Matéria Escura","c":1,"s":"espadas","t":"Dispare um filamento de energia cósmica que ignora barreiras convencionais. Cause 1 de dano Sombrio ou Psíquico direto no Vigor do alvo.","r":"comum","a":"O Farol","k":"O Cósmico","b":""},{"n":"Harmonização Astral","c":1,"s":"copas","t":"Alinhe-se com as frequências cósmicas. Resgate 1 carta com naipe de ♦ Ouros da sua pilha de descarte para a sua mão.","r":"comum","a":"O Farol","k":"O Cósmico","b":""},{"n":"Campo de Força Expansivo","c":3,"s":"ouros","t":"Projete uma redoma cósmica que cobre a zona inteira. A redoma possui 4 pontos de Integridade: todo ataque externo atinge a redoma antes de ferir qualquer herói dentro dela.","r":"rara","a":"O Farol","k":"O Cósmico","b":""},{"n":"Inversão Gravitacional Localizada","c":2,"s":"paus","t":"Inverta a gravidade sob os pés dos inimigos. Todos os adversários terrestres na mesma zona são jogados contra o teto (ou caem no ar), sofrendo 2 de dano Cinético e perdendo a capacidade de reação no turno atual.","r":"rara","a":"O Farol","k":"O Cósmico","b":""},{"n":"Lança de Singularidade","c":2,"s":"espadas","t":"Arremesse uma cunha de matéria condensada. Cause 3 de dano Cósmico perfurante, destruindo 1 ponto de integridade de Coberturas Pesadas e atravessando campos de força inimigos.","r":"rara","a":"O Farol","k":"O Cósmico","b":""},{"n":"Transferência de Massa / Apoio Cinético","c":1,"s":"ouros","t":"(Reação) Altere a inércia de um projétil ou golpe fatal que atingiria um parceiro. Desvie o ataque em 90 graus para o chão, anulando até 3 de dano do golpe.","r":"rara","a":"O Farol","k":"O Cósmico","b":"","x":1},{"n":"Ressonância de Pulso Astral","c":2,"s":"copas","t":"Emita uma onda que desativa eletrônicos e sobrecarrega canais de energia. Drones, robôs e veículos na zona ficam desativados por 1 rodada inteira.","r":"rara","a":"O Farol","k":"O Cósmico","b":""},{"n":"Micro-Buraco Negro / Vórtice de Eventos","c":4,"s":"espadas","t":"Abra uma fissura no espaço que engole tudo ao redor. Cause 4 de dano Cósmico em todos os inimigos da zona e puxe-os para o ponto central. Destrói todas as Coberturas Leves e Pesadas da área.","r":"epica","a":"O Farol","k":"O Cósmico","b":"","o":1},{"n":"Barreira Ômega Planetária","c":3,"s":"ouros","t":"Erga uma muralha cósmica maciça entre duas zonas. A muralha bloqueia absolutamente qualquer ataque, raio ou explosão que tente cruzar a divisória durante 2 rodadas completas (Integridade 6).","r":"epica","a":"O Farol","k":"O Cósmico","b":""},{"n":"Esmagamento Gravitacional de Dez Vezes","c":3,"s":"espadas","t":"Aumente a força da gravidade sobre um único adversário a níveis colossais. Cause 4 de dano Cinético direto no Vigor; o alvo é esmagado contra o chão e fica completamente Imobilizado na próxima rodada.","r":"epica","a":"O Farol","k":"O Cósmico","b":""},{"n":"Restauração por Teia Quântica","c":2,"s":"copas","t":"Reorganize as moléculas de um parceiro caído ou gravemente ferido. Restaure 4 pontos de Vigor real de um aliado adjacente e remova qualquer condição crítica de sangramento ou envenenamento.","r":"epica","a":"O Farol","k":"O Cósmico","b":""},{"n":"Aura de Farol Estelar","c":3,"s":"ouros","t":"Seu corpo emana a luz das primeiras galáxias. Durante 2 rodadas completas, você e todos os aliados visíveis na cena recebem Redução de Dano 1 permanente e tornam-se imunes a qualquer efeito de controle mental ou dano Psíquico.","r":"epica","a":"O Farol","k":"O Cósmico","b":""},{"n":"Surto de Sobrevivência","c":1,"s":"ouros","t":"Recupere imediatamente 2 de Vigor. Se você estiver com metade ou menos do seu Vigor máximo, esta carta custa 0 de Pulso.","r":"comum","a":"","k":"","b":"Sangue Mutante"},{"n":"Evolução Reativa","c":2,"s":"espadas","t":"Desfira um contra-ataque de 2 de dano Cinético contra um inimigo adjacente logo após sofrer dano físico. Você ganha Redução de Dano 1 contra o próximo ataque que sofrer nesta rodada.","r":"rara","a":"","k":"","b":"Sangue Mutante"},{"n":"Reação Aleatória","c":2,"s":"espadas","t":"Cause 2 de dano de um dano aleatório a um alvo. Se este ataque destruir uma Cobertura ou nocautear um Capanga, o impacto salta para um alvo adjacente causando 1 de dano.","r":"comum","a":"","k":"","b":"Acidente Científico"},{"n":"Descarga Fora de Controle","c":1,"s":"copas","t":"Empurre todos os inimigos e objetos soltos adjacentes a você para uma zona de function tone(f,t,d,ty='sine',v=.1,f2){if(muted)return;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+t;o.type=ty;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+.03)}catch(e){}}

const TC={'O Portador':'#c4c8d0','O Blindado':'#8a949e','O Punitivo':'#dc143c','O Pugilista':'#cc5500','O Conjurador':'#9b59d0','O Construtor':'#2ecc71',
 'O Mentalista':'#ff3fa4','O Espectro':'#f4f4ff','O Acrobata':'#ffbf00','O Velocista':'#2b7bff','O Elementar':'#e2725b','O Monstro':'#6b8a2a','O Solar':'#ffd700','O Cósmico':'#5b5bf0'};

 'O Psíquico':'Poder mental: rompe mentes e age pela telepatia.','O Cinético':'Mestre do movimento e da energia cinética.','O Metamorfo':'Transforma o corpo em elementos ou em um monstro.','O Farol':'Poder solar e cósmico que ilumina e protege.'};
const poolIds=(a,t,b)=>CARDS.map((_,i)=>i).filter(i=>(CARDS[i].a===a&&CARDS[i].k===t&&!CARDS[i].b)||(b&&CARDS[i].b===b));
const short=(t,n)=>t.length>n?t.slice(0,t.lastIndexOf(' ',n))+'…':t;

/* =====================================================================
   MÓDULO 1 — ESTADO (autoridade = Mestre) + REGRAS DE AÇÃO
   Para a fase 2 (cartas/regras): adicione novos `case` em apply().
